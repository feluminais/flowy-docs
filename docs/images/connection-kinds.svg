<svg xmlns="http://www.w3.org/2000/svg" width="460" height="262" viewBox="0 0 460 262" role="img" aria-label="The six connection kinds and the plain line, each drawn as the canvas draws it, with its name and the kind word that picks it">
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--line:#d6d3d1;--edge:#78716c}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--line:#57534e;--edge:#78716c}}
.sheet{fill:var(--bg);stroke:var(--line)}
.stroke-line{stroke:var(--edge);stroke-width:1.5;fill:none}
.fill{fill:var(--edge);stroke:none}
.stroke{fill:none;stroke:var(--edge);stroke-linecap:round;stroke-linejoin:round}
.hollow{fill:var(--bg);stroke:var(--edge);stroke-linecap:round;stroke-linejoin:round}
.name{fill:var(--fg);font:14px system-ui,sans-serif}
.word{fill:var(--muted);font:13px ui-monospace,Consolas,monospace}
</style>
<rect class="sheet" x="0.5" y="0.5" width="459" height="261" rx="10"/>
<g><line class="stroke-line" x1="22" y1="29" x2="118" y2="29"/><path class="stroke" d="M-9.5 -4L-1.5 0L-9.5 4" stroke-width="1.75" transform="matrix(-1 0 0 -1 22 29)"/><path class="fill" d="M0 0L-10 -4.5L-10 4.5Z" transform="matrix(1 0 0 1 118 29)"/><text class="name" x="140" y="29" dominant-baseline="central">Request and reply</text><text class="word" x="330" y="29" dominant-baseline="central">kind: request</text></g>
<g><line class="stroke-line" x1="22" y1="63" x2="118" y2="63"/><path class="stroke" d="M-9.5 -4L-1.5 0L-9.5 4M-15.5 -4L-7.5 0L-15.5 4" stroke-width="1.75" transform="matrix(-1 0 0 -1 22 63)"/><path class="fill" d="M0 0L-10 -4.5L-10 4.5Z" transform="matrix(1 0 0 1 118 63)"/><text class="name" x="140" y="63" dominant-baseline="central">Request then stream</text><text class="word" x="330" y="63" dominant-baseline="central">kind: stream</text></g>
<g><line class="stroke-line" x1="22" y1="97" x2="118" y2="97"/><path class="stroke" d="M-9.5 -4L-1.5 0L-9.5 4" stroke-width="1.75" transform="matrix(1 0 0 1 118 97)"/><text class="name" x="140" y="97" dominant-baseline="central">Publish and subscribe</text><text class="word" x="330" y="97" dominant-baseline="central">kind: publish</text></g>
<g><line class="stroke-line" x1="22" y1="131" x2="118" y2="131"/><path class="hollow" d="M0 0C0 1.933 -1.567 3.5 -3.5 3.5C-5.433 3.5 -7 1.933 -7 0C-7 -1.933 -5.433 -3.5 -3.5 -3.5C-1.567 -3.5 0 -1.933 0 0Z" stroke-width="1.5" transform="matrix(-1 0 0 -1 22 131)"/><path class="stroke" d="M-9.5 -4L-1.5 0L-9.5 4" stroke-width="1.75" transform="matrix(1 0 0 1 118 131)"/><text class="name" x="140" y="131" dominant-baseline="central">Cached publish</text><text class="word" x="330" y="131" dominant-baseline="central">kind: cached</text></g>
<g><line class="stroke-line" x1="22" y1="165" x2="118" y2="165"/><path class="hollow" d="M0 0L-6 -3.5L-12 0L-6 3.5Z" stroke-width="1.5" transform="matrix(-1 0 0 -1 22 165)"/><path class="stroke" d="M-9.5 -4L-1.5 0L-9.5 4" stroke-width="1.75" transform="matrix(1 0 0 1 118 165)"/><text class="name" x="140" y="165" dominant-baseline="central">Object updates</text><text class="word" x="330" y="165" dominant-baseline="central">kind: object</text></g>
<g><line class="stroke-line" x1="22" y1="199" x2="118" y2="199" stroke-dasharray="11 3 2 3"/><path class="fill" d="M0 0L-10 -4.5L-10 4.5Z" transform="matrix(1 0 0 1 118 199)"/><text class="name" x="140" y="199" dominant-baseline="central">Extension point</text><text class="word" x="330" y="199" dominant-baseline="central">kind: extension</text></g>
<g><line class="stroke-line" x1="22" y1="233" x2="118" y2="233"/><path class="fill" d="M0 0L-10 -4.5L-10 4.5Z" transform="matrix(1 0 0 1 118 233)"/><text class="name" x="140" y="233" dominant-baseline="central">Plain line</text><text class="word" x="330" y="233" dominant-baseline="central">no kind</text></g>
</svg>
