name: Colour and scale
about: Made-up numbers for the showcase. The source sets blue dots, one dot for every 50 calls a second, and a dot area that follows the size of a call. Each shape under Colour and scale shows one thing it does.
unit: requests/s
entry: source
source:
  color: blue
  dot: rate / 50
  size: bytes / 400
