name: Several sources tested together
about: Made-up numbers for the showcase. Source A and Source B sent at once, four combinations. Shared service fills faster than the two runs added say, because the two compete for it. The line to Not split by source says how many calls it carries and not which source sent them, so it is grey.
sources:
  a: { name: Source A, entry: a-in, unit: calls/s, color: blue, dot: rate / 50, size: bytes / 400 }
  b: { name: Source B, entry: b-in, unit: calls/s, color: green, dot: rate / 10 }
levels:
  - load: { a: 500, b: 50 }
    overall: { rate: 550, p50: 39, p95: 117, errors: 0 }
    objects:
      shared: { util: 0.153 }
    connections:
      - { from: a-in, to: gateway, rate: 500, p50: 20, bytes: 800, by: { a: { rate: 500, bytes: 800 } } }
      - { from: b-in, to: gateway, rate: 50, p50: 20, bytes: 100, by: { b: { rate: 50, bytes: 100 } } }
      - { from: gateway, to: shared, rate: 550, p50: 39, errors: 0, by: { a: { rate: 500, bytes: 800 }, b: { rate: 50, bytes: 100 } } }
      - { from: gateway, to: audit, rate: 28, p50: 13 }
  - load: { a: 500, b: 500 }
    overall: { rate: 1000, p50: 74, p95: 222, errors: 0 }
    objects:
      shared: { util: 0.73 }
    connections:
      - { from: a-in, to: gateway, rate: 500, p50: 37, bytes: 800, by: { a: { rate: 500, bytes: 800 } } }
      - { from: b-in, to: gateway, rate: 500, p50: 37, bytes: 100, by: { b: { rate: 500, bytes: 100 } } }
      - { from: gateway, to: shared, rate: 1000, p50: 74, errors: 0, by: { a: { rate: 500, bytes: 800 }, b: { rate: 500, bytes: 100 } } }
      - { from: gateway, to: audit, rate: 50, p50: 25 }
  - load: { a: 4000, b: 50 }
    overall: { rate: 4050, p50: 76, p95: 228, errors: 0 }
    objects:
      shared: { util: 0.768 }
    connections:
      - { from: a-in, to: gateway, rate: 4000, p50: 38, bytes: 800, by: { a: { rate: 4000, bytes: 800 } } }
      - { from: b-in, to: gateway, rate: 50, p50: 38, bytes: 100, by: { b: { rate: 50, bytes: 100 } } }
      - { from: gateway, to: shared, rate: 4050, p50: 76, errors: 0, by: { a: { rate: 4000, bytes: 800 }, b: { rate: 50, bytes: 100 } } }
      - { from: gateway, to: audit, rate: 203, p50: 25 }
  - load: { a: 4000, b: 500 }
    overall: { rate: 4500, p50: 88, p95: 264, errors: 0.02 }
    objects:
      shared: { util: 0.97 }
    connections:
      - { from: a-in, to: gateway, rate: 4000, p50: 44, bytes: 800, by: { a: { rate: 4000, bytes: 800 } } }
      - { from: b-in, to: gateway, rate: 500, p50: 44, bytes: 100, by: { b: { rate: 500, bytes: 100 } } }
      - { from: gateway, to: shared, rate: 4500, p50: 88, errors: 0.02, by: { a: { rate: 4000, bytes: 800 }, b: { rate: 500, bytes: 100 } } }
      - { from: gateway, to: audit, rate: 225, p50: 29 }
