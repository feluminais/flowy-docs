objects:
  steps:
    type: system
    name: Step animations
    description: |
      One pair of shapes for each way a step can travel, named for the animation they play.

      Each animation has a flow of its own with a single step to click through: Send, Call, Event, Callback, Flash, Bolt drop,
      Send with a word, Fail and Timeout (Flash has two, because the step before sets it off).

      **Every step animation** plays them all: press **P** to watch them one after the other.
  structure:
    type: system
    name: Flow structure
    description: |
      One set of shapes for each way steps can be grouped: **Repeat**, **Branch**, **Parallel** and **Flow link**.

      Each has a flow of the same name, with the chip, lane tabs and progress bar that go with it.
  performance:
    type: system
    name: Performance
    description: |
      One shape for each thing a load test can show, named for what it shows.

      Open the Performance tab (**T**), pick **Every load effect**, then press **Ramp** or step the levels with the arrow keys.

  send-from:
    type: app
    in: steps
    name: Send · from
    tech: send
    description: "`animation: send`. Something runs one way along the line. The sender does not wait."
  send-to:
    type: store
    in: steps
    shape: queue
    name: Send · to
    tech: send
    description: Takes the envelope in with a squash.
  call-from:
    type: app
    in: steps
    name: Call · from
    tech: call
    description: "`animation: call`. The envelope goes, the sender waits, and the reply comes back."
  call-to:
    type: store
    in: steps
    name: Call · to
    tech: call
    description: Takes the envelope in, then answers.
  event-from:
    type: app
    in: steps
    name: Event · from
    tech: event
    description: "`animation: event`. A bolt runs along the line, and the receiver flashes."
  event-to:
    type: app
    in: steps
    shape: hexagon
    name: Event · to
    tech: event
    description: Flashes when the bolt arrives.
  callback-from:
    type: app
    in: steps
    name: Callback · from
    tech: callback
    description: "`animation: callback`. A ring leaves this shape and a bell runs to the subscriber."
  callback-to:
    type: app
    in: steps
    name: Callback · to
    tech: callback
    description: The subscriber. A ring goes out when the bell arrives.
  after-source:
    type: app
    in: steps
    name: Flash · source
    tech: send, then callback
    description: Hands something to the publisher, which is what sets the callback off.
  after-from:
    type: app
    in: steps
    name: Flash · from
    tech: callback, trigger outside
    description: "`animation: {kind: callback, trigger: outside}`, right after a step that landed here. This shape flashes, then the bell runs."
  after-to:
    type: app
    in: steps
    name: Flash · to
    tech: callback, trigger outside
    description: The subscriber.
  cold-from:
    type: app
    in: steps
    name: Bolt drop · from
    tech: callback, trigger outside
    description: "`animation: {kind: callback, trigger: outside}`, with no step before it that landed here. A bolt drops onto this shape, then the bell runs."
  cold-to:
    type: app
    in: steps
    name: Bolt drop · to
    tech: callback, trigger outside
    description: The subscriber.
  fail-from:
    type: app
    in: steps
    name: Fail · from
    tech: send, fail
    description: "`animation: {kind: send, outcome: fail}`. The envelope runs to the receiver, which refuses it."
  fail-to:
    type: app
    in: steps
    name: Fail · to
    tech: send, fail
    description: Flashes when the refusal arrives.
  timeout-from:
    type: app
    in: steps
    name: Timeout · from
    tech: call, timeout
    description: "`animation: {kind: call, outcome: timeout}`. The envelope goes, the sender waits, no reply comes, and the line dims."
  timeout-to:
    type: app
    in: steps
    name: Timeout · to
    tech: call, timeout
    description: Takes the envelope in and never answers.

  repeat-from:
    type: app
    in: structure
    name: Repeat · from
    description: The caller. It asks again until the service answers.
  repeat-to:
    type: app
    in: structure
    name: Repeat · to
    description: The service. It is busy on the first two tries.
  branch-from:
    type: app
    in: structure
    name: Branch · from
    description: Decides which lane happens.
  branch-a:
    type: app
    in: structure
    name: Branch · lane A
    description: Takes the first lane.
  branch-b:
    type: app
    in: structure
    name: Branch · lane B
    description: Takes the second lane.
  parallel-from:
    type: app
    in: structure
    name: Parallel · from
    description: Starts all three lanes together.
  parallel-a:
    type: app
    in: structure
    name: Parallel · lane A
    description: Has two steps, so lane A keeps going after the others have finished.
  parallel-b:
    type: app
    in: structure
    name: Parallel · lane B
    description: One step.
  parallel-c:
    type: app
    in: structure
    name: Parallel · lane C
    description: One step.
  link-from:
    type: app
    in: structure
    name: Flow link · from
    description: Hands the story to another flow.
  link-to:
    type: app
    in: structure
    name: Flow link · to
    description: Where the other flow carries on.

  load:
    type: app
    in: performance
    name: Load
    description: Where the load comes in. Every shape below is reached from here.
  traffic:
    type: app
    in: performance
    name: Traffic
    description: The line from Load gets thicker and busier as the load goes up. The shape itself stays plain.
  latency:
    type: app
    in: performance
    name: Latency
    description: The dots on the line from Load slow down as calls take longer. The shape itself stays plain.
  failing-calls:
    type: app
    in: performance
    name: Failing calls
    description: More and more of the dots on the line from Load turn red. The shape itself stays plain.
  strain:
    type: app
    in: performance
    name: Strain
    description: Busy. The outline runs from green to red as the shape uses more of its capacity, from 10% at 10 requests/s to 100% at 160.
  failing-shape:
    type: app
    in: performance
    name: Failing shape
    description: Busy because calls fail. Failing 5% counts as full, so the outline runs to red early.
  queue:
    type: store
    in: performance
    shape: queue
    name: Queue
    description: Waiting. The number is how many calls are waiting, from 0 to 3000. The outline stays plain because only the waiting was measured.
  not-measured:
    type: app
    in: performance
    name: Not measured
    description: Nothing was measured here, so it stays plain at every load. Missing is never drawn as zero.
  rolled-up:
    type: app
    in: performance
    name: Rolled up
    description: |
      A shape that holds others shows the worst strain inside it and the waiting added up.

      Double-click it to see each part.
  rolled-a:
    type: component
    in: rolled-up
    name: Rolled up · A
    description: Busy and waiting both grow. At 10 requests/s it is 20% busy with nothing waiting, and at 160 it is 90% busy with 120 waiting.
  rolled-b:
    type: component
    in: rolled-up
    name: Rolled up · B
    description: Waits for 10 calls at every load, and gets less busy as the load goes up, from 50% to 30%.

connections:
  - { from: send-from, to: send-to, label: send }
  - { from: call-from, to: call-to, label: call }
  - { from: event-from, to: event-to, label: event }
  - { from: callback-from, to: callback-to, label: callback }
  - { from: after-source, to: after-from, label: hands over }
  - { from: after-from, to: after-to, label: callback }
  - { from: cold-from, to: cold-to, label: callback }
  - { from: fail-from, to: fail-to, label: fail }
  - { from: timeout-from, to: timeout-to, label: timeout }
  - { from: repeat-from, to: repeat-to, label: asks and answers }
  - { from: repeat-to, to: repeat-from }
  - { from: branch-from, to: branch-a, label: lane A }
  - { from: branch-from, to: branch-b, label: lane B }
  - { from: parallel-from, to: parallel-a, label: lane A }
  - { from: parallel-a, to: parallel-from }
  - { from: parallel-from, to: parallel-b, label: lane B }
  - { from: parallel-from, to: parallel-c, label: lane C }
  - { from: link-from, to: link-to, label: hands over and answers }
  - { from: link-to, to: link-from }
  - { from: load, to: traffic, label: calls }
  - { from: load, to: latency, label: calls }
  - { from: load, to: failing-calls, label: calls }
  - { from: load, to: strain, label: calls }
  - { from: load, to: failing-shape, label: calls }
  - { from: load, to: queue, label: calls }
  - { from: load, to: not-measured, label: calls }
  - { from: load, to: rolled-a, label: calls }
  - { from: load, to: rolled-b, label: calls }
