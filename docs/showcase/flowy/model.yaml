objects:
  steps:
    type: system
    name: Step animations
    description: |
      One pair of shapes for each way a step can travel, named for the animation they play.

      Each animation has a flow of its own with a single step to click through: Send, Call, Event, Callback, Flash, Bolt drop,
      Send with a word, Fail, Timeout, Lost, Rejected, Intercepted (twice: by a shape and by a name), Duplicated, Delayed and Share
      (Flash has two, because the step before sets it off).

      **Every step animation** plays them all: press **P** to watch them one after the other.
  structure:
    type: system
    name: Flow structure
    description: |
      One set of shapes for each way steps can be grouped: **Repeat**, **Branch**, **Parallel** and **Flow link**.

      Each has a flow of the same name, with the chip, lane tabs and progress bar that go with it.
  performance:
    type: system
    name: Performance
    description: |
      One shape for each thing a load test can show, named for what it shows.

      Open the Performance tab (**T**), pick **Every load effect**, then press **Ramp** or step the levels with the arrow keys.
  states:
    type: system
    name: Shape states
    description: |
      One shape that goes through every state, and one that holds another shape in a state.

      Play **Every state** to watch a shape start, run, degrade, stop, restart and run again, and **State inside a shape** to see a shape show that something inside it is not running.
  time:
    type: system
    name: Runs over time
    description: |
      A run measured over time instead of over load, with events on its timeline that set the state of a shape.

      Open the Performance tab (**T**), pick **Every state over time**, then press **Play**, drag the slider or click an event.
  compare:
    type: system
    name: Compare
    description: |
      A flow and the flow that replaced it, tagged as a pair, with a note. Each has one step that goes, one that is new and one that changes, so every mark is on show.

      Play **Compare after** and press **C** to open the pair. Turn on **Show changes** for the marks, and pick **Swap** then **X** to watch the shapes glide, fade in and fade out.
  send-from:
    type: app
    in: steps
    name: Send · from
    tech: send
    description: "`animation: send`. Something runs one way along the line. The sender does not wait."
  send-to:
    type: store
    in: steps
    shape: queue
    name: Send · to
    tech: send
    description: Takes the envelope in with a squash.
  effects-from:
    type: app
    in: steps
    name: Effects · from
    tech: effect
    description: "`animation: { kind: send, effect: bounce }`. What the moving label does on its way, besides travelling. None of them bends its shape."
  effects-to:
    type: store
    in: steps
    shape: queue
    name: Effects · to
    tech: effect
    description: Sits down the slope from its sender, so the label runs along a slanted line and shows it stays level.
  call-from:
    type: app
    in: steps
    name: Call · from
    tech: call
    description: "`animation: call`. The envelope goes, the sender waits, and the reply comes back."
  call-to:
    type: store
    in: steps
    name: Call · to
    tech: call
    description: Takes the envelope in, then answers.
  event-from:
    type: app
    in: steps
    name: Event · from
    tech: event
    description: "`animation: event`. A bolt runs along the line, and the receiver flashes."
  event-to:
    type: app
    in: steps
    shape: hexagon
    name: Event · to
    tech: event
    description: Flashes when the bolt arrives.
  callback-from:
    type: app
    in: steps
    name: Callback · from
    tech: callback
    description: "`animation: callback`. A ring leaves this shape and a bell runs to the subscriber."
  callback-to:
    type: app
    in: steps
    name: Callback · to
    tech: callback
    description: The subscriber. A ring goes out when the bell arrives.
  after-source:
    type: app
    in: steps
    name: Flash · source
    tech: send, then callback
    description: Hands something to the publisher, which is what sets the callback off.
  after-from:
    type: app
    in: steps
    name: Flash · from
    tech: callback, trigger outside
    description: "`animation: {kind: callback, trigger: outside}`, right after a step that landed here. This shape flashes, then the bell runs."
  after-to:
    type: app
    in: steps
    name: Flash · to
    tech: callback, trigger outside
    description: The subscriber.
  cold-from:
    type: app
    in: steps
    name: Bolt drop · from
    tech: callback, trigger outside
    description: "`animation: {kind: callback, trigger: outside}`, with no step before it that landed here. A bolt drops onto this shape, then the bell runs."
  cold-to:
    type: app
    in: steps
    name: Bolt drop · to
    tech: callback, trigger outside
    description: The subscriber.
  fail-from:
    type: app
    in: steps
    name: Fail · from
    tech: send, fail
    description: "`animation: {kind: send, outcome: fail}`. The envelope runs to the receiver, which refuses it."
  fail-to:
    type: app
    in: steps
    name: Fail · to
    tech: send, fail
    description: Flashes when the refusal arrives.
  timeout-from:
    type: app
    in: steps
    name: Timeout · from
    tech: call, timeout
    description: "`animation: {kind: call, outcome: timeout}`. The envelope goes, the sender waits, no reply comes, and the line dims."
  timeout-to:
    type: app
    in: steps
    name: Timeout · to
    tech: call, timeout
    description: Takes the envelope in and never answers.
  lost-from:
    type: app
    in: steps
    name: Lost · from
    tech: send, lost
    description: "`animation: {kind: send, outcome: lost, reason: Packet dropped}`. The envelope runs part of the way, pops, and leaves a cross where it went."
  lost-to:
    type: app
    in: steps
    name: Lost · to
    tech: send, lost
    description: Never hears of it, so it never squashes or flashes.
  rejected-from:
    type: app
    in: steps
    name: Rejected · from
    tech: call, rejected
    description: "`animation: {kind: call, outcome: rejected, reason: Rate limit}`. The envelope stops at the bar by the receiver and comes back red."
  rejected-to:
    type: app
    in: steps
    name: Rejected · to
    tech: call, rejected
    description: Turns the call away at the door. The bar flashes.
  intercepted-from:
    type: app
    in: steps
    name: Intercepted · from
    tech: call, intercepted by a shape
    description: "`animation: {kind: call, outcome: intercepted, by: intercepted-by}`. The envelope leaves the line for a third shape, which takes it and lights."
  intercepted-to:
    type: app
    in: steps
    name: Intercepted · to
    tech: call, intercepted by a shape
    description: Never gets the call.
  intercepted-by:
    type: app
    in: steps
    name: Intercepted · taken by
    tech: not an end of the step
    description: The third shape. It gets a dashed outline for the whole step and lights when the envelope arrives.
  named-from:
    type: app
    in: steps
    name: Intercepted by a name · from
    tech: call, intercepted by a name
    description: "`animation: {kind: call, outcome: intercepted, by: {name: Café wifi proxy}}`. The party is not in the model, so a dashed marker with its name hangs below the line."
  named-to:
    type: app
    in: steps
    name: Intercepted by a name · to
    tech: call, intercepted by a name
    description: Never gets the call.
  duplicated-from:
    type: app
    in: steps
    name: Duplicated · from
    tech: send, duplicated
    description: "`animation: {kind: send, outcome: duplicated, reason: Retried}`. A second copy leaves the first part of the way along and arrives later."
  duplicated-to:
    type: app
    in: steps
    name: Duplicated · to
    tech: send, duplicated
    description: Takes the envelope in twice, with a squash each time.
  delayed-from:
    type: app
    in: steps
    name: Delayed · from
    tech: call, delayed
    description: "`animation: {kind: call, outcome: delayed, reason: Cold start}`. The envelope waits partway beside a turning dashed clock, then goes on."
  delayed-to:
    type: app
    in: steps
    name: Delayed · to
    tech: call, delayed
    description: Takes the envelope in late, then answers.
  share-from:
    type: app
    in: steps
    name: Share of requests · from
    tech: send, lost, share 30
    description: "`animation: {kind: send, outcome: lost, share: 30, at: 0.7}`. Ten requests go one after another and three of them are lost 70 percent of the way along: r1, r2 and r3, each with its own colour and a ring."
  share-to:
    type: app
    in: steps
    name: Share of requests · to
    tech: send, lost, share 30
    description: Takes in the seven that arrive.
  repeat-from:
    type: app
    in: structure
    name: Repeat · from
    description: The caller. It asks again until the service answers.
  repeat-to:
    type: app
    in: structure
    name: Repeat · to
    description: The service. It is busy on the first two tries.
  branch-from:
    type: app
    in: structure
    name: Branch · from
    description: Decides which lane happens.
  branch-a:
    type: app
    in: structure
    name: Branch · lane A
    description: Takes the first lane.
  branch-b:
    type: app
    in: structure
    name: Branch · lane B
    description: Takes the second lane.
  parallel-from:
    type: app
    in: structure
    name: Parallel · from
    description: Starts all three lanes together.
  parallel-a:
    type: app
    in: structure
    name: Parallel · lane A
    description: Has two steps, so lane A keeps going after the others have finished.
  parallel-b:
    type: app
    in: structure
    name: Parallel · lane B
    description: One step.
  parallel-c:
    type: app
    in: structure
    name: Parallel · lane C
    description: One step.
  link-from:
    type: app
    in: structure
    name: Flow link · from
    description: Hands the story to another flow.
  link-to:
    type: app
    in: structure
    name: Flow link · to
    description: Where the other flow carries on.
  load:
    type: app
    in: performance
    name: Load
    description: Where the load comes in. Every shape below is reached from here.
  traffic:
    type: app
    in: performance
    name: Traffic
    description: The line from Load gets thicker and busier as the load goes up. The shape itself stays plain.
  latency:
    type: app
    in: performance
    name: Latency
    description: The dots on the line from Load slow down as calls take longer. The shape itself stays plain.
  failing-calls:
    type: app
    in: performance
    name: Failing calls
    description: More and more of the dots on the line from Load turn red. The shape itself stays plain.
  strain:
    type: app
    in: performance
    name: Strain
    description: Busy. The outline runs from green to red as the shape uses more of its capacity, from 10% at 10 requests/s to 100% at 160.
  failing-shape:
    type: app
    in: performance
    name: Failing shape
    description: Busy because calls fail. Failing 5% counts as full, so the outline runs to red early.
  queue:
    type: store
    in: performance
    shape: queue
    name: Queue
    description: Waiting. The number is how many calls are waiting, from 0 to 3000. The outline stays plain because only the waiting was measured.
  not-measured:
    type: app
    in: performance
    name: Not measured
    description: Nothing was measured here, so it stays plain at every load. Missing is never drawn as zero.
  rolled-up:
    type: app
    in: performance
    name: Rolled up
    description: |
      A shape that holds others shows the worst strain inside it and the waiting added up.

      Double-click it to see each part.
  rolled-a:
    type: component
    in: rolled-up
    name: Rolled up · A
    description: Busy and waiting both grow. At 10 requests/s it is 20% busy with nothing waiting, and at 160 it is 90% busy with 120 waiting.
  rolled-b:
    type: component
    in: rolled-up
    name: Rolled up · B
    description: Waits for 10 calls at every load, and gets less busy as the load goes up, from 50% to 30%.
  states-caller:
    type: app
    in: states
    name: State · caller
    description: Calls the other shapes. It is always running.
  states-service:
    type: app
    in: states
    name: State · service
    description: Goes through every state, one step at a time.
  states-holder:
    type: app
    in: states
    name: State · holder
    description: Holds a part. Shows a ring with a dashed edge while the part is in a state and it has none of its own.
  states-part:
    type: component
    in: states-holder
    name: State · part
    description: The part. Its state shows on the holder at the overview.
  time-caller:
    type: app
    in: time
    name: Time · caller
    description: Calls the other shapes. It is always running, and gets busy while the service is off.
  time-service:
    type: app
    in: time
    name: Time · service
    description: Goes through every state as the run plays, one event at a time.
  time-holder:
    type: app
    in: time
    name: Time · holder
    description: Holds a part. Shows a ring with a dashed edge while the part is in a state and it has none of its own.
  time-part:
    type: component
    in: time-holder
    name: Time · part
    description: The part. It stops at 45 s and runs again at 72 s, and its state shows on the holder at the overview.
  scale:
    type: system
    name: Colour and scale
    description: |
      One shape for each thing a run's **source** sets: the colour of the dots, how many dots stand for the calls, and how big each is.

      Open the Performance tab (**T**), pick **Colour and scale**, then press **Ramp** or step the levels with the arrow keys.
  source:
    type: app
    in: scale
    name: Source
    description: Where the calls come in. Every dot on the lines from here is blue, because the run sets a colour.
  dots-few:
    type: app
    in: scale
    name: Few calls
    description: One dot for every 50 calls a second. The line goes from 50 calls a second to 800, so from 1 dot to 16.
  dots-many:
    type: app
    in: scale
    name: Ten times the calls
    description: Ten times the calls of Few calls, so ten times the dots, until the screen limit. Past 24 dots at once the line is scaled down, and the key and its numbers say so.
  dots-slow:
    type: app
    in: scale
    name: Same calls, slower
    description: The same calls as Few calls, so the same number of dots, but each call takes longer, so the dots move slower.
  dots-big:
    type: app
    in: scale
    name: Bigger calls
    description: The more bytes a call carries, the bigger its dot. The area of a dot follows the size of a call, so 1,600 bytes is a dot twice as wide as 400 bytes.
  calls-lost:
    type: app
    in: scale
    name: Lost calls
    description: A share of the calls dies on the way. Each ends in a small pop where it is lost.
  calls-rejected:
    type: app
    in: scale
    name: Rejected calls
    description: A share of the calls is turned away at the end of the line. Each stops at a bar and comes back red.
  sources:
    type: system
    name: Several sources
    description: |
      Two sources of requests at once, each with its own slider, colour and scale: added from separate runs (**Several sources added**) and tested together (**Several sources tested together**).

      Open the Performance tab (**T**), pick one of them, then move a slider or press **Ramp** on a source. The chart follows the source you moved last.
  a-in:
    type: app
    in: sources
    name: Source A
    description: Where Source A's calls come in. Its dots are blue, one for every 50 calls a second, and bigger than Source B's because its calls carry more.
  b-in:
    type: app
    in: sources
    name: Source B
    description: Where Source B's calls come in. Its dots are green, one for every 10 calls a second.
  gateway:
    type: app
    in: sources
    name: Where they meet
    description: Both sources send their calls through here. The line to Shared service carries both, so it has a stream of dots for each, side by side, in its colour. Past 24 dots at once both are scaled down together, so the ratio stays true.
  shared:
    type: store
    in: sources
    name: Shared service
    description: Both sources fill it. In the run added from separate runs its use is the two added, and past 100% it reads "Added use is over 100%". In the run tested together it is what was measured with both at once.
  audit:
    type: app
    in: sources
    name: Not split by source
    description: The run says how many calls this line carries but not which source sent them, so its dots are grey and the key says "Other calls".
  compare-client:
    type: app
    in: compare
    name: Compare · client
    description: Both flows start here, with the same first step, so it carries no mark.
  compare-api:
    type: app
    in: compare
    name: Compare · api
    description: Used by every step of both flows. A shape both flows draw is Changed when a step on it is marked.
  compare-old:
    type: app
    in: compare
    name: Compare · old service
    description: Only the older flow calls it, so it is Removed.
  compare-db:
    type: store
    in: compare
    name: Compare · database
    description: Both flows read it, but the newer one waits for the answer, so its step and line are Changed.
  compare-cache:
    type: store
    in: compare
    name: Compare · cache
    description: Only the newer flow calls it, so it is New.
  channels:
    type: system
    name: Open channels
    description: |
      Three things a step can leave open for the steps after it: an **Open stream**, **Listening** and a **Running job**.

      Play **Every open channel**: each one stays drawn until a step closes it, so you can see it keep running while the story moves on.
  chan-client:
    type: app
    in: channels
    name: Channels · client
    tech: opens and closes
    description: Opens a stream, registers a listener and starts a job, then closes each one.
  chan-feed:
    type: app
    in: channels
    name: Channels · feed
    tech: stream
    description: "`opens: stream`. Dots keep running along the line, towards the client, until a step closes it."
  chan-hook:
    type: app
    in: channels
    external: "true"
    name: Channels · webhook
    tech: listener
    description: "`opens: listener`. A bell rings out from the client, which keeps listening for what the webhook sends."
  chan-worker:
    type: app
    in: channels
    name: Channels · worker
    tech: job
    description: "`opens: job`. An arc keeps turning on the worker while the job runs."
