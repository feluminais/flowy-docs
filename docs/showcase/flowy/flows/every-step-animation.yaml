name: Every step animation
view: steps
steps:
  - from: send-from
    to: send-to
    text: Sends one way and carries on without waiting
    animation: send
    description: A tube along the line, an envelope running through it, and a squash at each end.
  - from: call-from
    to: call-to
    text: Calls and waits for the answer
    animation: call
    description: The envelope goes, dots wait over the caller, and the reply comes back in the answer's colour.
  - from: event-from
    to: event-to
    text: Raises an event
    animation: event
    description: A bolt runs along the line and the receiver flashes when it arrives.
  - from: callback-from
    to: callback-to
    text: Runs a callback on its subscriber
    animation: callback
    description: A ring leaves the publisher, a bell runs to the subscriber, and a ring goes out there.
  - { from: after-source, to: after-from, text: Hands the publisher something, animation: send }
  - from: after-from
    to: after-to
    text: Runs a callback that the step before set off
    animation: { kind: callback, trigger: outside }
    description: The publisher flashes, because the step before landed on it, and then the bell runs.
  - from: cold-from
    to: cold-to
    text: Runs a callback that something outside set off
    animation: { kind: callback, trigger: outside }
    description: No step before landed on the publisher, so a bolt drops onto it first and then the bell runs.
  - { from: send-from, to: send-to, text: "Sends again, this time with a word on the blob", animation: { kind: send, carries: order 42 } }
  - from: fail-from
    to: fail-to
    text: Sends and is refused
    animation: { kind: send, outcome: fail }
    description: The envelope runs to the receiver, which flashes when the refusal lands.
  - from: timeout-from
    to: timeout-to
    text: Calls and gets no answer
    animation: { kind: call, outcome: timeout }
    description: The envelope goes, the sender keeps waiting, no reply comes, and the line dims.
  - from: lost-from
    to: lost-to
    text: Sends and the request is lost on the way
    animation: { kind: send, outcome: lost, reason: Packet dropped }
    description: The envelope pops partway along the line and leaves a cross. Nothing arrives.
  - from: rejected-from
    to: rejected-to
    text: Calls and is turned away at the door
    animation: { kind: call, outcome: rejected, reason: Rate limit }
    description: The envelope stops at a bar by the receiver and comes back red.
  - from: intercepted-from
    to: intercepted-to
    text: Calls and a third shape takes the call
    animation: { kind: call, outcome: intercepted, by: intercepted-by }
    description: The envelope leaves the line for the shape that takes it, which lights.
  - from: named-from
    to: named-to
    text: Calls and a proxy outside the model reads the call
    animation: { kind: call, outcome: intercepted, by: { name: Café wifi proxy } }
    description: The envelope leaves the line for a dashed marker with the proxy's name.
  - from: duplicated-from
    to: duplicated-to
    text: Sends and it is delivered twice
    animation: { kind: send, outcome: duplicated, reason: Retried }
    description: A second copy leaves the first, and the receiver takes both in.
  - from: delayed-from
    to: delayed-to
    text: Calls and the request waits on the way
    animation: { kind: call, outcome: delayed, reason: Cold start }
    description: The envelope waits beside a turning dashed clock, then goes on and is answered.
  - from: share-from
    to: share-to
    text: Sends ten requests and three are lost
    animation: { kind: send, outcome: lost, share: 30, reason: Packet dropped, at: 0.7 }
    description: A burst of ten, one after another. The lost ones are named r1, r2 and r3, each with its own colour and a ring, and they vanish 70 percent of the way along.
