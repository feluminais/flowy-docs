name: Plum fail scenario
about: Rated by the ordering team from a year of incidents and support tickets.
scale:
  severity: { low: Nobody notices, high: A customer loses money or the kitchen stops }
  occurrence: { low: Never seen, high: Most days }
  detection: { low: An alert fires within a minute, high: We hear from a customer }
modes:
  stripe-timeout:
    from: checkout
    to: stripe
    mode: Stripe doesn't answer within 5 s
    effect: The order waits on a hold that may or may not exist.
    cause: Stripe is slow, or the network between Plum and Stripe drops.
    severity: 8
    occurrence: 4
    detection: 3
    controls: Three tries with backoff. The idempotency key stops a double hold.
    action: Page when over 1% of holds time out for 5 min.
    owner: Payments
    status: planned
    after: { severity: 8, occurrence: 4, detection: 1 }
    affects: [customer-app, kitchen-tablet]
    flow: capture-payment
    step: 3
    run: stripe-outage
  card-declined:
    from: checkout
    to: stripe
    mode: Stripe declines the card
    effect: The order is not placed, and the customer is asked for another card.
    cause: The card is short of funds, expired or blocked.
    severity: 3
    occurrence: 7
    detection: 2
    controls: The hold is released and the app asks again.
    owner: Payments
    status: accepted
    affects: [customer-app]
    flow: capture-payment
    step: 7
  refund-not-recorded:
    on: refunds
    mode: Stripe refunds the money but the database write fails
    effect: The customer has the money back, and Plum still shows the order as paid.
    cause: Orders DB is unreachable when the refund is saved.
    severity: 9
    occurrence: 2
    detection: 7
    controls: Support can see the refund in Stripe.
    action: Compare refunds with Stripe every night.
    owner: Support tools
    status: open
    affects: [support-console]
    flow: refund-not-recorded
    step: 4
    description: |
      The refund and the write are separate steps, so one can succeed without the other.
      The nightly comparison finds the gap but does not close it.
  orders-db-down:
    on: orders-db
    mode: Orders DB is unavailable
    effect: No order can be placed or read until it is back.
    cause: The primary fails, or a failover takes longer than planned.
    severity: 10
    occurrence: 2
    detection: 1
    controls: A standby takes over within a minute.
    action: Rehearse the failover quarterly.
    owner: Platform
    status: planned
    affects: [customer-app, web, kitchen-tablet, order-api]
    flow: orders-db-fails-over
    step: 3
  double-tap:
    on: order-api
    mode: A double tap places two orders
    effect: The customer is charged twice for one basket.
    cause: The app resends when the first reply is slow.
    severity: 6
    occurrence: 5
    detection: 4
    controls: Every order carries an idempotency key. A repeated key is refused.
    owner: Ordering
    status: done
    after: { severity: 6, occurrence: 1, detection: 4 }
    affects: [customer-app]
    flow: order-sent-twice
    step: 2
  menu-cache-stale:
    on: menu-cache
    mode: Serves a menu up to 5 min old
    effect: A customer orders a dish the kitchen has just taken off.
    cause: Entries expire after 5 min.
    severity: 2
    occurrence: 8
    detection: 3
    controls: The kitchen can refuse an item, and the customer is told.
    owner: Ordering
    status: accepted
    affects: [customer-app, web]
    flow: menu-is-read
    step: 4
  eta-mapbox-fails:
    from: eta
    to: mapbox
    mode: Mapbox calls fail at dinner rush
    effect: Dispatch has no travel times, so couriers are matched on distance alone.
    cause: Plum exceeds Mapbox's rate limit above 900 orders a minute.
    severity: 6
    occurrence: 6
    detection: 3
    controls: Dispatch falls back to straight-line distance.
    action: Batch the travel-time calls, as the second run tries.
    owner: Delivery
    status: planned
    after: { severity: 6, occurrence: 2, detection: 3 }
    affects: [dispatch, offers]
    flow: mapbox-rate-limit
    step: 4
    run: dinner-rush
  fleet-position-writes:
    on: fleet-db
    mode: Position writes fail
    effect: Live tracking shows an old position, or none.
    owner: Delivery
    status: open
    affects: [tracking]
  events-lag:
    on: events
    mode: Dispatch reads events slower than they arrive
    effect: A courier is matched minutes after the customer paid, and the arrival time shown is wrong.
    cause: A burst of orders (the dinner rush) outruns Dispatch's single consumer.
    severity: 5
    occurrence: 5
    detection: 3
    controls: A lag alert fires at 30 s.
    action: Run a second Dispatch consumer.
    owner: Delivery
    status: planned
    after: { severity: 5, occurrence: 2, detection: 3 }
    affects: [dispatch, offers]
    flow: events-arrive-late
    step: 2
  kitchen-tablet-offline:
    on: kitchen-tablet
    mode: The tablet goes offline and nobody accepts within two minutes
    effect: The customer waits two minutes, then is told the order was cancelled.
    cause: The tablet loses its Wi-Fi, or its battery runs out.
    severity: 4
    occurrence: 5
    detection: 2
    controls: The order cancels itself and the card hold is released.
    owner: Restaurants
    status: accepted
    affects: [customer-app]
    flow: nobody-accepts
    step: 2
  offers-no-answer:
    on: offers
    mode: No courier answers within 30 seconds
    effect: The order waits for a courier, and the arrival time shown keeps growing.
    cause: The couriers near the restaurant are busy, out of signal or away from their phones.
    severity: 6
    occurrence: 6
    detection: 3
    controls: Each offer moves on to the next courier. When the list runs out, the customer is told.
    action: Widen the search when the list runs out.
    owner: Delivery
    status: planned
    after: { severity: 6, occurrence: 3, detection: 3 }
    affects: [customer-app, dispatch]
    flow: no-courier-answers
    step: 3
  tracking-signal-lost:
    on: tracking
    mode: The courier loses signal and the map freezes
    effect: The customer sees a courier who has stopped moving.
    cause: The courier drives through a tunnel or a dead zone.
    severity: 2
    occurrence: 7
    detection: 2
    controls: Positions older than 1 min are dropped, so the map holds still until a fresh one arrives.
    owner: Delivery
    status: accepted
    affects: [customer-app, web]
    flow: deliver-order
    step: 8
  sms-not-delivered:
    from: notifier
    to: twilio
    mode: Twilio accepts an SMS and the carrier drops it
    effect: The customer never gets the confirmation or the courier's arrival message.
    cause: The number is wrong, switched off or blocked by the carrier.
    severity: 4
    occurrence: 4
    detection: 9
    controls: None. Plum does not read Twilio's delivery receipts.
    action: Read the delivery receipts and alert when fewer than 95% arrive.
    owner: Notifications
    status: open
    affects: [customer-app]
    flow: sms-dropped
    step: 4
  warehouse-down:
    on: warehouse
    mode: The warehouse is down
    effect: Reports run late. Orders carry on.
    cause: The cluster is being upgraded, or its disk is full.
    severity: 2
    occurrence: 3
    detection: 4
    controls: Events stay on the stream and replay when it recovers.
    owner: Data
    status: accepted
    affects: [admin]
