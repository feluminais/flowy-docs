name: Scan for networks
view: root
tags: [happy path]
steps:
  - { from: user, to: touch-app, text: Taps Scan, animation: { kind: send, carries: tap } }
  - from: touch-app
    to: controller
    text: Starts a scan and keeps listening
    animation: { kind: call, opens: stream, name: Scan results, towards: from }
    via: starts a scan
  - from: controller
    to: network-daemon
    text: Asks the radio to scan
    animation: { kind: call, opens: stream, name: Radio scan, towards: from }
    via: starts a radio scan
  - from: controller
    to: touch-app
    text: Adds each network it hears to the list
    animation: { kind: send, carries: network }
    via: starts a scan
    payload: found-network
    description: |
      The results ride the line that asked for the scan, so the screen needs no second connection.
  - { from: user, to: touch-app, text: Taps Stop, animation: { kind: send, carries: tap } }
  - { from: touch-app, to: controller, text: Closes the scan, animation: { kind: send, closes: Scan results }, via: starts a scan }
  - { from: controller, to: network-daemon, text: Stops the radio scan, animation: { kind: send, closes: Radio scan }, via: starts a radio scan }
