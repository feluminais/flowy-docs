name: "Customer orders"
about: "Made-up numbers for the demo. Orders climbing from 100 to 1,200 a minute with no courier pings on top: each order asks Matcher for a courier, Matcher reads Fleet DB and calls ETA, and ETA calls Mapbox. One dot stands for 4 calls a second. ETA runs out of room first."
unit: orders/min
entry: customer-app
source:
  color: blue
  dot: rate / 4
