      - { from: tracking, to: fleet-db, rate: 58, p50: 3, bytes: 140, errors: 0, by: { orders: { rate: 8 }, pings: { rate: 50 } } }
      - { from: matcher, to: fleet-db, rate: 1.7, p50: 9, bytes: 900, errors: 0, by: { orders: { rate: 1.7 } } }
