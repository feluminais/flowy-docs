name: "Courier pings"
about: "Made-up numbers for the demo. Courier position pings climbing from 50 to 800 a second, through Live tracking to Fleet DB. One dot is 20 pings a second, so the line from Courier app is 2.5 dots at the lowest level and 40 at the highest. The screen holds 24, so the top level is scaled down. Fleet DB fills first."
unit: pings/s
entry: courier-app
source:
  color: green
  dot: rate / 20
levels:
  - load: 50
    overall: { rate: 50, p50: 24, p95: 60, errors: 0 }
    objects:
      tracking: { util: 0.06 }
      fleet-db: { util: 0.08 }
    connections:
      - { from: courier-app, to: tracking, rate: 50, p50: 18, p95: 46, bytes: 280, errors: 0 }
      - { from: tracking, to: fleet-db, rate: 50, p50: 3, p95: 8, bytes: 140, errors: 0 }
