name: "Orders and pings, added"
about: "Made-up numbers for the demo. Customer orders and courier pings, each from its own run at its own load, added. Fleet DB, Tracking and the lines between them read the sum. Both send calls along the line from Tracking to Fleet DB, so each draws in its own colour there. Added numbers look calmer near the limit than a combined test would."
adds: [orders-only, pings-climbing]
