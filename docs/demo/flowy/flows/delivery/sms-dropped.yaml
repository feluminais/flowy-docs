name: The carrier drops the SMS
view: root
tags: [error path]
steps:
  - { from: customer, to: ordering, text: Places an order, animation: send, payload: basket, flow: place-order }
  - { from: ordering, to: notifications, text: Asks for an SMS that confirms it, animation: send, payload: message }
  - { from: notifications, to: twilio, text: Hands the confirmation to Twilio, animation: send, payload: sms }
  - from: twilio
    to: customer
    text: The carrier drops it before it reaches the phone
    animation: { kind: send, outcome: lost, reason: Carrier drops it, at: 0.6 }
    payload: sms
    description: |
      Twilio accepted the message, so Plum counts it as sent. It does not read Twilio's delivery receipts.
  - { from: notifications, text: Never hears that the customer got nothing }
