name: Dispatch hears about an order late
view: delivery
tags: [edge case]
steps:
  - from: events
    to: dispatch
    text: The placed event waits behind the dinner rush
    animation: { kind: event, outcome: delayed, reason: Consumer lag }
    description: |
      A single consumer reads every `placed` event. When orders arrive faster than it reads, they queue.
  - { from: dispatch, to: fleet-db, text: Finds couriers minutes after the customer paid, animation: call }
