name: A courier delivers it
view: delivery
tags: [happy path]
steps:
  - { from: customer, to: customer-app, text: Places an order, animation: { kind: send, carries: basket }, flow: place-order }
  - { from: events, to: dispatch, text: The placed order reaches Dispatch, animation: { kind: callback, trigger: outside, carries: placed } }
  - from: dispatch
    to: fleet-db
    text: Finds idle couriers near the restaurant
    animation: { kind: call, carries: who is idle }
    description: |
      The **Matcher** asks Mapbox how far each one is and ranks them by arrival, so the quickest gets the first offer.
  - { from: dispatch, to: notifier, text: Sends the offer as a push, animation: { kind: send, carries: offer, effect: bounce } }
  - { from: courier, to: courier-app, text: Accepts within 30 seconds, animation: { kind: send, carries: accept } }
  - { from: courier-app, to: dispatch, text: Sends the acceptance, animation: { kind: call, carries: accept } }
  - { from: restaurant, to: courier, text: Hands the food over at the counter, animation: { kind: send, carries: food } }
  - from: courier-app
    to: tracking
    text: Streams its position every 5 seconds
    animation: { kind: send, carries: position, effect: pulse }
    flow: follow-the-courier
    description: |
      **Tracking** passes each one to the customer's map. A courier who loses signal freezes there until a fresh position arrives.
  - { from: courier, to: customer, text: Hands the food over at the door, animation: { kind: send, carries: food } }
