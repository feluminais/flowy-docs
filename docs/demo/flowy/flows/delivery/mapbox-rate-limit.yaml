name: Mapbox turns the travel times away
view: dispatch
tags: [error path]
steps:
  - { from: customer, to: customer-app, text: Places one of 900 orders in a minute, animation: { kind: send, carries: basket }, flow: place-order }
  - { from: events, to: matcher, text: The placed order reaches the Matcher, animation: { kind: callback, trigger: outside, carries: placed } }
  - { from: matcher, to: eta, text: Asks who is quickest, animation: { kind: call, carries: who is quickest } }
  - from: eta
    to: mapbox
    text: Asks Mapbox for travel times and is turned away
    animation: { kind: call, outcome: rejected, reason: Rate limit }
    description: |
      Plum exceeds Mapbox's limit above 900 orders a minute. Mapbox rejects at once, so the call fails fast.
  - { from: eta, text: Falls back to straight-line distance and ranks more roughly }
