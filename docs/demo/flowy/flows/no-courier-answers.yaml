name: An offer goes unanswered
view: delivery
groups:
  offer:
    kind: repeat
    until: a courier accepts, or the list runs out
    text: One courier at a time, nearest first. Each has 30 seconds.
  result:
    kind: branch
steps:
  - { from: offers, to: notifier, text: "Offers the job, and the nearest courier doesn't answer within 30 seconds", group: offer }
  - { from: offers, text: Moves on to the next courier on the list, group: offer }
  - { from: courier-app, to: dispatch, text: "Accepts, and the offers stop", group: result, lane: A courier accepts }
  - { from: offers, to: notifier, text: Tells the customer that no courier is free yet, group: result, lane: The list runs out }
  - { from: dispatch, text: Searches again in a minute, group: result }
