name: An offer goes unanswered
view: delivery
groups:
  offer:
    kind: repeat
    until: a courier accepts, or the list runs out
    text: One courier at a time, nearest first. Each has 30 seconds.
  result:
    kind: branch
steps:
  - { from: offers, to: notifier, text: "Offers the job; the nearest courier doesn't answer in 30 s", group: offer, animation: { kind: call, outcome: timeout, reason: No answer in 30 s } }
  - { from: offers, text: Moves on to the next courier on the list, group: offer }
  - { from: courier-app, to: dispatch, text: "Accepts, and the offers stop", group: result, lane: A courier accepts, animation: { kind: call, carries: accept } }
  - { from: offers, to: notifier, text: Tells the customer that no courier is free yet, group: result, lane: The list runs out, animation: { kind: send, carries: no courier yet } }
  - { from: dispatch, text: Searches again in a minute, group: result }
