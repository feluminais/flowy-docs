name: A menu is read
view: order-api
groups:
  lookup:
    kind: branch
steps:
  - { from: customer-app, to: menu, text: Asks for a restaurant's menu, animation: { kind: call, carries: GET /menus } }
  - { from: menu, to: menu-cache, text: Looks the menu up, animation: { kind: call, carries: menu r_42 } }
  - from: menu-cache
    to: menu
    text: Hands back the stored menu
    group: lookup
    lane: The entry is there
    animation: { kind: send, carries: menu }
    description: |
      Entries last five minutes, so a restaurant's edit can take that long to show.
  - { from: menu, to: orders-db, text: Reads the menu from the database, group: lookup, lane: The entry has expired, animation: { kind: call, carries: menu } }
  - { from: menu, to: menu-cache, text: Stores it for five minutes, group: lookup, animation: { kind: send, carries: menu } }
  - { from: menu, to: customer-app, text: Returns the menu, animation: { kind: send, carries: menu } }
