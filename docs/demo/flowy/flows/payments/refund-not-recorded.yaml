name: The refund is not recorded
view: ordering
tags: [error path]
steps:
  - from: refunds
    to: stripe
    text: Stripe has refunded the charge
    animation: { kind: call, carries: refund }
    description: |
      The money is already back on the card. What can still go wrong is Plum's own records.
  - from: refunds
    to: orders-db
    text: Can't mark the order refunded, because Orders DB doesn't answer
    animation: { kind: call, outcome: timeout }
  - { from: refunds, text: "Leaves the order marked paid, though the money is back" }
  - { from: refunds, to: notifier, text: Still sends the customer a refund confirmation, animation: { kind: send, carries: confirm } }
