name: Support refunds an order
view: root
tags: [happy path]
compare:
  with: refund-not-recorded
  note: |
    The same refund twice. Right: what support sees, from the console to the customer's SMS. Left: the refund inside Ordering when Orders DB doesn't answer. Stripe returns the money, the order stays marked paid, and the customer still gets a confirmation.
steps:
  - { from: support, to: backoffice, text: Finds the order in the support console, animation: send, payload: ticket }
  - from: backoffice
    to: ordering
    text: "Asks for a refund, in full or by line"
    animation: call
    payload: refund
    reply:
      name: Refund done
      about: The order as it stands once Stripe has confirmed.
      example:
        language: json
        text: |
          { "orderId": "o-1042", "status": "refunded", "refunded": 2490, "reason": "late" }
  - from: ordering
    to: stripe
    text: The money goes back to the card
    animation: call
    payload: refund
    reply: stripe-refund
    description: |
      The order is marked refunded only after Stripe confirms, so the database never records a
      refund that didn't happen.
  - { from: ordering, to: notifications, text: Requests a confirmation, animation: send, payload: message }
  - { from: notifications, to: twilio, text: Hands the SMS to Twilio, animation: send, payload: sms }
  - from: twilio
    to: customer
    text: The customer reads that the money is back
    animation: { kind: send, effect: bounce }
    payload:
      name: Text message
      about: What the customer's phone shows.
      example:
        language: text
        text: |
          Plum: your refund of €24.90 is on its way back to your card. It can take up to 10 days to show.
