name: Stripe reports a charge
view: ordering
tags: [background]
steps:
  - from: stripe
    to: order-api
    text: "Calls Plum's webhook: the charge went through"
    animation: { kind: callback, trigger: outside }
    payload: charge
    reply: { name: Received, about: Plum answers at once so Stripe doesn't send the event again., example: { language: json, text: '{ "received": true }' } }
    description: |
      Stripe initiates this call, not Plum. The order is marked paid when it arrives.
  - { from: order-api, to: orders-db, text: Marks the order paid, animation: { kind: call, carries: paid } }
  - { from: order-api, text: Carries on to publish the order, flow: announce-order }
