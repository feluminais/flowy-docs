name: Stripe reports a charge
view: ordering
tags: [background]
groups:
  readers:
    kind: parallel
steps:
  - from: stripe
    to: order-api
    text: "Calls Plum's webhook: the charge went through"
    animation: { kind: callback, trigger: outside }
    payload: charge
    reply: { name: Received, about: Plum answers at once so Stripe doesn't send the event again., example: { language: json, text: '{ "received": true }' } }
  - { from: order-api, to: orders-db, text: Marks the order paid, animation: { kind: call, carries: paid } }
  - { from: order-api, to: events, text: Publishes the paid event and carries on without waiting, animation: { kind: event, carries: paid } }
  - from: events
    to: dispatch
    text: Dispatch consumes it and starts looking for a courier
    group: readers
    lane: Delivery
    flow: deliver-order
    animation: callback
  - { from: events, to: warehouse, text: Streams the same event to the warehouse, group: readers, lane: Warehouse, animation: { kind: event, carries: paid } }
