name: A double tap sends the order twice
view: ordering
steps:
  - from: customer-app
    to: order-api
    text: The same order arrives twice
    animation: { kind: send, outcome: duplicated, reason: Slow reply }
    description: |
      The app sends the order again when the first reply is slow. Both copies carry one idempotency key.
  - { from: order-api, to: orders-db, text: Saves the first copy and refuses the second, animation: send }
