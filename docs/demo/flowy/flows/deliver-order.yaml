name: A courier delivers it
view: delivery
steps:
  - { from: events, to: dispatch, text: Hears that an order was placed, animation: { kind: callback, trigger: outside, carries: placed } }
  - { from: dispatch, to: fleet-db, text: Finds idle couriers near the restaurant, animation: { kind: call, carries: who is idle } }
  - from: dispatch
    text: Ranks them by how soon each could arrive
    description: |
      The **Matcher** asks **ETA** for a travel time per courier, using distance, traffic and the
      vehicle. The quickest one is offered the job first.
  - { from: dispatch, to: notifier, text: Sends the offer as a push, animation: { kind: send, carries: offer, effect: bounce } }
  - { from: courier, to: courier-app, text: Accepts within 30 seconds, animation: { kind: send, carries: accept } }
  - from: courier-app
    to: tracking
    text: Streams its position every 5 seconds
    animation: { kind: send, carries: position, effect: pulse }
    flow: follow-the-courier
    description: |
      Only while a job is open. A position older than a minute is dropped, so a courier who loses
      signal stops moving on the customer's map until a fresh position comes in.
  - { from: tracking, to: customer-app, text: The customer watches the courier come, animation: { kind: send, carries: position } }
  - { from: courier-app, to: order-api, text: Marks the order delivered, animation: { kind: call, carries: delivered } }
