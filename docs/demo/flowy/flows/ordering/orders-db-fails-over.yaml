name: Orders DB fails over
view: ordering
tags: [error path, recovery]
steps:
  - { from: customer, to: customer-app, text: Taps Place order, animation: { kind: send, carries: basket } }
  - { from: customer-app, to: order-api, text: POST /orders with the basket, animation: { kind: call, carries: POST /orders } }
  - from: order-api
    to: orders-db
    text: A write gets no answer, because the primary has failed
    animation: { kind: call, outcome: timeout, reason: Primary is down }
    states: { orders-db: stopped }
  - { from: order-api, to: customer-app, text: Asks the customer to try again in a minute, animation: { kind: send, carries: try again }, states: { order-api: degraded } }
  - from: orders-db
    text: A standby takes over as the primary
    states: { orders-db: starting }
    description: |
      The standby has to catch up and be promoted. Plum rehearses this quarterly. Promotion has taken under a minute so far.
  - { from: order-api, to: orders-db, text: The next write goes through, animation: { kind: call, carries: order }, states: { orders-db: running, order-api: running } }
