name: A menu is read
view: order-api
tags: [happy path]
groups:
  lookup:
    kind: branch
steps:
  - { from: customer-app, to: menu, text: Asks for a restaurant's menu, animation: { kind: call, carries: GET /menus } }
  - { from: menu, to: menu-cache, text: Looks the menu up, animation: { kind: call, carries: menu r_42 } }
  - from: menu-cache
    to: menu
    text: Returns the cached menu
    group: lookup
    lane: Cache hit
    animation: { kind: send, carries: menu }
    description: |
      5 min TTL, so a restaurant's edit can take that long to appear.
  - { from: menu, to: orders-db, text: Reads the menu from the database, group: lookup, lane: Cache miss, animation: { kind: call, carries: menu } }
  - { from: menu, to: menu-cache, text: Caches it for 5 min, group: lookup, animation: { kind: send, carries: menu } }
  - { from: menu, to: customer-app, text: Returns the menu, animation: { kind: send, carries: menu } }
