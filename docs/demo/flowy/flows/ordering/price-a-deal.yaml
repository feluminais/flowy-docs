name: Pricing a meal deal
view: order-api
steps:
  - { from: basket, to: pricing, text: Asks for the total of a basket that holds a meal deal, animation: send }
  - from: pricing
    text: Prices a deal by pricing each of its parts, down to plain items that have a price
    animation: { kind: recurse, depth: 3, carries: deal, returns: price }
    description: |
      The menu editor allows deals inside deals three deep at most.
  - { from: pricing, to: basket, text: Hands back the total, animation: { kind: send, carries: total } }
