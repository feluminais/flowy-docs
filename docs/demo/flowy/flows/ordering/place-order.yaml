name: Customer places an order
view: ordering
tags: [happy path]
steps:
  - { from: customer, to: customer-app, text: Fills a basket and taps Place order, animation: { kind: send, carries: basket } }
  - from: customer-app
    to: order-api
    text: POST /orders with the basket
    animation: { kind: call, carries: POST /orders }
    payload: basket
    reply: receipt
  - from: order-api
    to: stripe
    text: Holds the amount on the card
    animation: { kind: call, carries: hold }
    payload: hold
  - { from: order-api, to: orders-db, text: Saves the order as placed, animation: { kind: call, carries: order }, payload: order }
  - { from: order-api, to: events, text: Publishes the order, animation: { kind: event, carries: placed }, payload: placed }
  - { from: events, to: dispatch, text: Dispatch starts looking for a courier, animation: { kind: callback, trigger: outside }, flow: deliver-order }
  - from: order-api
    to: kitchen-tablet
    text: The restaurant's tablet rings
    animation: { kind: event, carries: new order }
    description: |
      The kitchen has two minutes to accept, or the order is cancelled.
