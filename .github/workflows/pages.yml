# Publishes the Plum demo as a read-only page, made with the project's own `export` command.
# Two things to do once: set Settings > Pages > Source to "GitHub Actions", then add the repository variable PAGES_ENABLED = true
# (Settings > Secrets and variables > Actions > Variables). Until then the job is skipped, not failed: with Pages off, the deploy step
# answers 404 on every push, and a red run that always means the same thing hides the ones that matter.
name: pages

on:
  push:
    branches: [main]
    paths: ['docs/demo/**', 'ui/**', 'src/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js export --dir docs/demo/flowy --out site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
