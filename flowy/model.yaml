objects:
  reader:
    type: actor
    name: Reader
    description: |
      Someone on the team who wants to understand the repo. They open the canvas, zoom in where they
      need to, and in edit mode draw what isn't there yet.
  claude:
    type: actor
    name: Claude
    description: Claude, or another MCP client, writing the model from what it reads in the code.
  flowy:
    type: system
    name: Flowy Docs
    description: |
      Architecture docs you zoom through instead of scrolling through.

      One npm package with four ways in: the canvas in a browser, an MCP server for Claude, a static
      export, and Mermaid on the command line. They all read and write the same YAML through the
      same checks, so none of them can leave the folder in a state the others refuse.

      A native desktop app, built separately, reads and edits the same folders and draws them with
      its own renderer. It writes the same text through the same checks.
    links:
      - { title: Guide, url: docs/guide.md }
      - { title: Writing good Flowy docs, url: docs/writing.md }
  repo:
    type: system
    name: Your repo
    description: |
      The repo being documented. Flowy keeps the model in a `flowy/` folder at its root and points
      `code` paths at files beside it. Git keeps the history; Flowy has no store of its own.
  forge:
    type: system
    name: GitHub or GitLab
    description: Where `code` paths link to, worked out from the repo's origin, branch and place in the tree. Any other host and the paths are plain text. The desktop app also asks GitHub's Releases whether a newer version exists.
  host:
    type: system
    name: Static host
    description: Wherever an export is put (GitHub Pages, S3, a folder behind nginx). It serves plain files; the model travels inside `index.html`.
  folder:
    type: store
    in: repo
    name: flowy/ folder
    tech: YAML
    code: [flowy/]
    description: |
      `model.yaml` (objects and connections), `flows/<id>.yaml` (one walkthrough each) and
      `layout.yaml` (where shapes were dragged).

      Saving rewrites a file, so YAML comments don't survive: notes belong in an object's
      `description`. This repo documents itself with the folder you're reading now.
  cli:
    type: app
    in: flowy
    name: Command line
    tech: Node 22.18+
    code: [src/cli.ts, flowy.sh, flowy.cmd]
    description: |
      `npx flowy-docs` and what follows it: no argument serves the canvas, `mcp` speaks MCP over
      stdio, `export` writes a static copy, `mermaid` prints a diagram. In a clone, `flowy.sh` and
      `flowy.cmd` build once and then run the same thing.

      `--dir` picks the model folder, `--port` the port (or the next free one), `--no-open` leaves
      the browser alone.
  perf-lab:
    type: app
    in: flowy
    name: Performance lab
    tech: Node
    code: [perf-lab/]
    description: |
      A made-up shop that really runs, with an open-loop load generator that measures it and writes
      the run files the Performance tab reads. It is a test bed for Flowy, not a benchmark.
  desktop:
    type: app
    in: flowy
    name: Desktop app
    tech: Avalonia, .NET 10
    code: [desktop/]
    description: |
      A native reader and editor for the same folders: it reads the YAML itself and draws it with its
      own renderer, so there is no server and no browser behind it. It shows what the canvas shows (zoom
      through the levels, the side panel, flows, search, problems, light and dark) and reloads as the
      files change. One window per model, opened from a menu, a drop, Open Recent, a path on the
      command line or a right-click in Explorer, at the size it was last closed at. A sample model
      (Plum) ships with it, and View copies a diagram as Mermaid or saves it as a picture.

      Press E to edit: the forms, dragging, connecting, recording flows, Undo and Redo of the
      canvas. Every edit goes through the same checks as the browser's and Claude's, and a file
      changed elsewhere since it was read is never overwritten. Opening never creates files in a
      repo; only an edit does.
  desktop-core:
    type: component
    in: desktop
    name: Core
    tech: C#
    code: [desktop/Flowy.Core/]
    description: |
      A C# port of what `src/core` and the folder loader do, plus what the canvas decides: line
      paths, the camera, layout, the scene, search, the Mermaid text of a view or a flow, which
      folder a pick means, and what a click on a shape's link may open.

      It also edits, on the files' YAML and not on the typed model, so a key it doesn't know is kept.
      A writer produces the `yaml` package's text byte for byte, the edits twin `src/core/ops.ts`,
      and a session applies one, refuses it if it would add a problem, and writes the changed files
      only if they are still as they were read.

      Two readers must give the same answers, so a Node script runs the TypeScript over fixture
      folders and the canvas's own functions, and the C# tests must reproduce every number. That
      includes the beats of a step's animation and the maths that draws them, and the navigator's rows, flow groups and keys. A root
      test fails if the TypeScript changes without the fixtures being written again.
  desktop-canvas:
    type: component
    in: desktop
    name: Canvas and reader
    tech: Avalonia
    code: [desktop/Flowy.App/Canvas/, desktop/Flowy.App/ReaderView.cs, desktop/Flowy.App/SidePanel.cs, desktop/Flowy.App/Chrome.cs, desktop/Flowy.App/MarkdownView.cs, desktop/Flowy.App/Navigator.cs, desktop/Flowy.App/ExplorerView.cs, desktop/Flowy.App/FlowsView.cs]
    description: |
      Shapes are controls on a stage that moves with the camera, with one layer behind them for the
      frame and the lines. The reader holds what you've chosen: the view, the open panel, the flow
      playing.

      A shape is its outline (one of 13, drawn from the same path data as the browser's) with a tint
      of its own colour over it, then its tile, name and how many it holds. A line meets the outline,
      not the rectangle around it.

      The chrome around them is made of a few pieces in the colour of what they are about: a tile
      with the icon of a type on a tint of its colour, chips, section headings with a count, and
      cards. The side panel opens on a header in the shape's own colour, then its description, links,
      code and lines as cards, and the bar's buttons carry icons. All colours come from the stylesheet,
      so light and dark follow the system.

      Opening a shape is a short fly-off and settle-in, one step per screen refresh (the window's own
      animation-frame callback, not a timer, which ticks unevenly), and instant when the system asks
      for less motion.

      A tagged flow step plays over the shapes: a pipe along its line, something running through it,
      and the shapes ringing, flashing or squashing. The same frame-driven clock runs it and Autoplay's
      waits, and nothing moves when the system asks for less motion.

      A rail of icons on the left edge opens the navigator, as on the canvas: every flow grouped by
      where it plays, and the whole documentation as a tree drawn a window of rows at a time, shapes
      that hold others first and then by name. Details opens on the right, from its own rail or by
      picking a shape. Both panels are dragged wider or narrower by their inner edge, and a
      double-click puts the width back. Each project's open tab, open rows and panel widths are
      remembered in the app's state file.

      Descriptions are drawn by a small Markdown renderer: raw HTML is dropped, an image shows as
      its description in brackets and is never fetched, and a link opens only if it is http or https.
  desktop-shell:
    type: component
    in: desktop
    name: Windows and shell
    tech: Avalonia
    code: [desktop/Flowy.App/Shell.cs, desktop/Flowy.App/MainWindow.axaml.cs, desktop/Flowy.App/SingleInstance.cs]
    description: |
      One window per model folder, the File, View and Help menus (Open Recent, Reload, Copy as
      Mermaid, Save Picture, the demo), drops, and the saved state (recent folders, the line style,
      the window's size, the app chosen to open linked files). A folder that is deleted while open leaves the last good model with a
      banner, and opening it again carries on. A second launch hands its folder to the one already running through
      a pipe that only this user can open.
  desktop-install:
    type: component
    in: desktop
    name: Installer hooks and updates
    tech: Velopack
    code: [desktop/Flowy.App/Program.cs, desktop/Flowy.App/Updates.cs, desktop/Flowy.App/ExplorerEntries.cs, .github/workflows/desktop.yml]
    description: |
      Velopack builds the installer and runs the app's hooks: after an install or an update the
      "Open with Flowy Docs" entries go into Explorer's folder menu for this user, and uninstalling
      takes them out.

      A few seconds after start-up an installed copy asks GitHub's Releases whether there is a newer
      version, unless Help › Check for updates automatically is off. Nothing about the reader is sent.
  server:
    type: app
    in: flowy
    name: Local server
    tech: Node http
    code: [src/node/server.ts, src/node/files.ts, src/node/git.ts]
    description: |
      Serves the built canvas and the model to 127.0.0.1 only, and watches the folder.

      Two guards keep other pages out: a request whose Host isn't this server's is refused (a site
      can point its own domain at 127.0.0.1), and a write must carry `X-Flowy: 1`, which only a page
      from this origin may send.
  canvas:
    type: app
    in: flowy
    name: Canvas
    tech: React, React Flow
    code: [ui/]
    description: |
      The page: shapes you zoom into, lines that stay quiet until you point at them, flows that play
      step by step, and edit mode behind E.

      A step tagged with an `animation:` plays as a pipe with a blob running through it, and Autoplay
      steps through a flow on its own.

      A rail of icons on the left edge opens a panel with two tabs: every flow in the documentation,
      and the whole documentation as a tree. Details opens on the right, from its own rail or by
      picking a shape. Both panels are dragged wider or narrower by their inner edge, as in VS Code,
      and a double-click puts the width back.

      The same bundle is served by the local server and shipped in an export; on an exported page
      the model comes from the HTML and there is nothing to save to.
  mcp:
    type: app
    in: flowy
    name: MCP server
    tech: stdio
    code: [src/node/mcp.ts]
    description: |
      Nine tools over stdio: read the model, a view or a Mermaid diagram, and write objects,
      connections and flows.

      Calls arrive in bursts and run one at a time, in order, so each one sees what the one before
      it wrote. A write that loses a race on the file is retried once.

      Its instructions hand Claude the writing rules: survey the repo and check the list first, what
      earns a shape, and how to word a description, a label and a flow step.
  exporter:
    type: app
    in: flowy
    name: Export
    code: [src/node/export.ts]
    description: |
      Writes a read-only copy of the canvas, with the model as JSON inside `index.html`.

      It replaces only what it wrote last time, so a `.git` or a `CNAME` beside it stays, and it
      refuses a folder that holds the model or the canvas it is copying.
  core:
    type: app
    in: flowy
    name: Core
    code: [src/core/]
    description: |
      What a model is and what may be done to it, with no Node and no browser in it: the canvas
      bundles the same files the server runs.

      That is why an edit drawn on the canvas and the same edit from Claude are refused for the
      same reasons.
  api:
    type: component
    in: server
    name: HTTP API
    code: [src/node/server.ts]
    description: |
      `GET /api/state` for everything the canvas shows, `PUT`/`DELETE /api/file/<path>` for one
      file, `GET /api/events` for a line that says "changed" when the folder does.

      The watcher waits 100 ms, so an editor saving three files wakes the page once.
  filestore:
    type: component
    in: server
    name: Folder reader
    code: [src/node/files.ts]
    description: |
      Reads the whole folder into one model and writes one file at a time.

      A write carries the version the caller read (a hash of the file). If the file moved on since,
      the write is dropped with 409 rather than overwriting someone else's change, and nothing is
      written at all while any file in the folder fails to parse.
  gitlink:
    type: component
    in: server
    name: Code links
    code: [src/node/git.ts]
    description: Turns the repo's origin, branch and prefix into the address `code` paths link to. Worked out once per folder, so a branch switch shows after a restart.
  shell:
    type: component
    in: canvas
    name: Canvas page
    code: [ui/src/App.tsx, ui/src/Camera.tsx]
    description: |
      The view you're in, the shape or line you picked, the flow playing, and edit mode. It keeps the
      address in step, so a link opens where it says and Back goes back.

      The camera fits a view when you arrive and pans a shape out from under the side panels, but never
      undoes your own panning.
  graph:
    type: component
    in: canvas
    name: Layout
    code: [ui/src/graph.ts, ui/src/Box.tsx, ui/src/Line.tsx]
    description: |
      Turns a view into shapes and lines: dagre places what hasn't been dragged, and the shapes that
      live elsewhere wait around the edges, each on the side that crosses fewest lines.

      A dragged shape keeps its saved place; the rest flow around it.
  motion:
    type: component
    in: canvas
    name: Step motion
    code: [ui/src/StepMotion.tsx, ui/src/motion.ts]
    description: |
      Draws a tagged step over the canvas: the line as a pipe, a blob running through it, and rings,
      flashes and squashes on the shapes. It asks core for the beats and knows nothing about kinds.

      Nothing moves when the system asks for less motion; Autoplay then waits a few seconds on each step.
  navigator:
    type: component
    in: canvas
    name: Navigator
    code: [ui/src/Navigator.tsx, ui/src/navstate.ts, ui/src/navstore.ts, ui/src/window.ts]
    description: |
      The rail of icons on the left edge and the tabs it opens: every flow, grouped by where it plays,
      and the whole documentation as a tree drawn a window of rows at a time. It asks core for the rows,
      which come in VS Code's order: shapes that hold others first, then the rest, each by name.

      The edges of this panel and of the Details panel are sashes you drag to resize them.

      Which tab was open, which shapes were open in the tree and how wide the two panels are are
      remembered for each project, in the browser's storage.
  sync:
    type: component
    in: canvas
    name: Saving
    code: [ui/src/useModel.ts, ui/src/save.ts]
    description: |
      Holds the model the page shows and saves edits one at a time, each one read-apply-check-write
      like the MCP server's.

      It keeps what it can undo for as long as the page is open, and an undo whose file changed
      since is refused rather than forced.
  panel:
    type: component
    in: canvas
    name: Side panel
    code: [ui/src/Panel.tsx, ui/src/Chrome.tsx, ui/src/icons.tsx, ui/src/Search.tsx]
    description: |
      A shape's description, code links and connections (out and in) while reading; the fields, the flow recorder and Add while editing. Search finds a shape anywhere in the model.

      It looks like the desktop app: a header in the shape's own colour with its tile and chips, then
      section headings and cards, and icons on the bar's buttons.
  model:
    type: component
    in: core
    name: Files
    code: [src/core/model.ts, src/core/state.ts]
    description: |
      Reads and writes the folder's YAML. Parsed with YAML's failsafe schema, so every value stays
      the text that was typed: an id like `007` or a version like `3.10` survives a save.

      A file that can't be trusted (bad syntax, duplicate keys, a merge conflict) is a parse
      error, and nothing is written over it.
  check:
    type: component
    in: core
    name: Checks
    code: [src/core/check.ts]
    description: |
      Every problem in the model, never throwing: a missing name, a shape in a type that can't hold
      it, an unknown shape, colour or icon, a line to nothing, a flow step the view can't show, a
      `code` path that isn't there.

      Problems are shown, not fixed. A file edited by hand keeps its problems until someone deals
      with them.
  animation:
    type: component
    in: core
    name: Animation
    code: [src/core/animation.ts, desktop/Flowy.Core/Animation.cs]
    description: |
      What a flow step's `animation:` tag may say, and what each kind does, written as a timed list of
      beats: a tube along the line, a blob running through it, a ring or flash or gulp on a shape.

      Nothing here draws. The canvas and the desktop app each draw the beats, so a new kind is a
      recipe here and not new drawing code in both.
  perf:
    type: component
    in: core
    name: Performance runs
    code: [src/core/perf.ts]
    description: |
      A load test as numbers: for each load level that was tested, what each shape and each
      connection measured. It reads a run file, checks it against the model, and works out what the
      Performance tab will show at a load: the numbers between two tested levels, the worst of what
      a shape holds, where things first struggle, and how busy each line is.

      It replays what was measured and never predicts: above the highest tested load there is
      nothing to show.
  views:
    type: component
    in: core
    name: Views
    code: [src/core/views.ts]
    description: |
      What one level shows: the shapes inside it, the shapes elsewhere that lines reach, and where a
      line between two of them lands.

      A line between shapes deeper down is drawn between the shapes that stand for them here, and
      several such lines merge into one, labelled "N connections".
  outline:
    type: component
    in: core
    name: Outline
    code: [src/core/outline.ts, desktop/Flowy.Core/Outline.cs]
    description: |
      What the navigator shows: the shapes as a tree with the flows under the systems they play in,
      the flows grouped by where they play, and what each key does in the tree.

      It draws nothing. The canvas and the desktop app each draw these rows, so they agree on what is
      on every line: its counts, its problem mark and which rows a filter keeps.
  ops:
    type: component
    in: core
    name: Edits
    code: [src/core/ops.ts]
    description: |
      Every change anything may make: add or change a shape (its type, shape, colour, opacity and icon
      too), connect, disconnect, put or delete a flow or a custom icon, place shapes, pick a line style.

      Each one returns a new model, and a change that would add a problem is refused before
      anything is written.
  look:
    type: component
    in: core
    name: Look
    tech: TypeScript
    code: [src/core/look.ts, src/core/icons.ts]
    description: |
      How a shape is drawn: 13 outlines (each with the room its text has and the polygon a line
      meets), named colours with a light and a dark form, how strong a fill is, and about 150
      built-in icons plus the ones a model defines under `icons:`.

      The type picks a default for each (an actor is a pill, a store a cylinder). The desktop app
      writes its own copy of these tables from these two files, and a fixture checks the copy.
  mermaid:
    type: component
    in: core
    name: Mermaid
    code: [src/core/mermaid.ts]
    description: A view as a flowchart, a flow as a sequence diagram, fenced and ready to paste where GitHub or GitLab draws it. A shape becomes the closest Mermaid node, and a colour a style line.
connections:
  - { from: reader, to: cli, label: npx flowy-docs }
  - { from: reader, to: desktop, label: opens folders in a window }
  - { from: reader, to: shell, label: "reads it, draws in edit mode" }
  - { from: reader, to: host, label: opens the shared link }
  - { from: claude, to: mcp, label: writes the model }
  - { from: cli, to: server, label: serves the canvas }
  - { from: desktop-canvas, to: desktop-core, label: what to draw }
  - { from: desktop-canvas, to: outline, label: asks for the navigator's rows }
  - { from: desktop-shell, to: desktop-canvas, label: one reader per window }
  - { from: desktop-core, to: folder, label: reads and watches, and writes edits }
  - { from: desktop-core, to: core, label: ported from; fixtures keep the answers equal }
  - { from: desktop-install, to: forge, label: checks for a new release }
  - { from: desktop-shell, to: desktop-install, label: Help › Check for Updates }
  - { from: cli, to: mcp, label: speaks MCP over stdio }
  - { from: cli, to: exporter, label: writes a static copy }
  - { from: cli, to: mermaid, label: prints a diagram }
  - { from: sync, to: api, label: "reads the model, saves a file" }
  - { from: sync, to: api, label: listens for changes }
  - { from: shell, to: sync, label: "saves edits, takes them back" }
  - { from: shell, to: graph, label: what to draw }
  - { from: shell, to: panel, label: what is selected }
  - { from: shell, to: motion, label: the step playing }
  - { from: motion, to: animation, label: asks for the beats }
  - { from: shell, to: navigator, label: the panel's tabs }
  - { from: navigator, to: outline, label: asks for the rows }
  - { from: shell, to: ops, label: the edit the reader made }
  - { from: panel, to: forge, label: links code paths }
  - { from: graph, to: views, label: "shapes, outsiders and lines" }
  - { from: api, to: filestore, label: reads and writes }
  - { from: api, to: gitlink, label: where code links point }
  - { from: filestore, to: folder, label: one file at a time }
  - { from: filestore, to: model, label: parses and serializes }
  - { from: filestore, to: check, label: every load is checked }
  - { from: gitlink, to: repo, label: asks git for origin and branch }
  - { from: mcp, to: filestore, label: the same reads and writes }
  - { from: mcp, to: ops, label: one change at a time }
  - { from: ops, to: check, label: refuses what adds a problem }
  - { from: ops, to: model, label: writes it back as YAML }
  - { from: check, to: views, label: can this view show it }
  - { from: check, to: animation, label: asks if a step's tag is right }
  - { from: views, to: model, label: reads }
  - { from: outline, to: views, label: asks what each shape holds }
  - { from: mermaid, to: views, label: what the view holds }
  - { from: mermaid, to: look, label: how each shape is drawn }
  - { from: check, to: look, label: whether a shape, colour or icon exists }
  - { from: graph, to: look, label: outline, colour and icon of each shape }
  - { from: exporter, to: filestore, label: loads the model }
  - { from: exporter, to: canvas, label: copies the built page }
  - { from: exporter, to: host, label: writes a read-only copy }
  - { from: filestore, to: perf, label: reads the runs in perf/ }
  - { from: perf, to: views, label: which line a connection lands in }
  - { from: perf, to: model, label: reads files the same way }
  - { from: perf-lab, to: perf, label: writes runs it can read }
