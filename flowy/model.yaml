objects:
  reader:
    type: actor
    name: Reader
    description: |
      Someone on the team who wants to understand the repo. They open the canvas, zoom in where they
      need to, and in edit mode draw what isn't there yet.
  claude:
    type: actor
    name: Claude
    description: Claude, or another MCP client, writing the model from what it reads in the code.
  flowy:
    type: system
    name: Flowy Docs
    description: |
      Architecture docs you zoom through instead of scrolling through.

      One npm package with four ways in: the canvas in a browser, an MCP server for Claude, a static
      export, and Mermaid on the command line. They all read and write the same YAML through the
      same checks, so none of them can leave the folder in a state the others refuse.

      A native desktop app, built separately, reads and edits the same folders and draws them with
      its own renderer. It writes the same text through the same checks.

      A VS Code extension, also built separately, shows the same canvas in a panel inside the editor.
    links:
      - { title: Guide, url: docs/guide.md }
      - { title: Writing good Flowy docs, url: docs/writing.md }
  repo:
    type: system
    name: Your repo
    description: |
      The repo being documented. Flowy keeps the model in a `flowy/` folder at its root and points
      `code` paths at files beside it. Git keeps the history; Flowy has no store of its own.
  forge:
    type: system
    name: GitHub or GitLab
    description: Where `code` paths link to, worked out from the repo's origin, branch and place in the tree. Any other host and the paths are plain text. The desktop app also asks GitHub's Releases whether a newer version exists.
  host:
    type: system
    name: Static host
    description: Wherever an export is put (GitHub Pages, S3, a folder behind nginx). It serves plain files; the model travels inside `index.html`.
  folder:
    type: store
    in: repo
    name: flowy/ folder
    tech: YAML
    code: [flowy/]
    description: |
      `model.yaml` (objects and connections), `flows/<id>.yaml` (one walkthrough each),
      `failures/<id>.yaml` (one failure analysis each) and `layout.yaml` (where shapes were dragged).

      Saving rewrites a file, so YAML comments don't survive: notes belong in an object's
      `description`. This repo documents itself with the folder you're reading now.
  cli:
    type: app
    in: flowy
    name: Command line
    tech: Node 22.18+
    code: [src/cli.ts, flowy.sh, flowy.cmd]
    description: |
      `node dist/cli.js` and what follows it: no argument serves the canvas, `mcp` speaks MCP over
      stdio, `export` writes a static copy, `mermaid` prints a diagram, `failures` prints the ranked failure table. `flowy.sh` and
      `flowy.cmd` build once and then run the same thing.

      `--dir` picks the model folder, `--port` the port (or the next free one), `--no-open` leaves
      the browser alone.
  perf-lab:
    type: app
    in: flowy
    name: Performance lab
    tech: Node
    code: [perf-lab/]
    description: |
      A made-up shop that really runs, with an open-loop load generator that measures it and writes
      the run files the Performance tab reads. It is a test bed for Flowy, not a benchmark.
  desktop:
    type: app
    in: flowy
    name: Desktop app
    tech: Avalonia, .NET 10
    code: [desktop/]
    description: |
      A native reader and editor for the same folders: it reads the YAML itself and draws it with its
      own renderer, so there is no server and no browser behind it. It shows what the canvas shows (zoom
      through the levels, the side panel, flows, search, problems, light and dark) and reloads as the
      files change. One window per model, opened from a menu, a drop, Open Recent, a path on the
      command line or a right-click in Explorer, at the size it was last closed at. A sample model
      (Plum) ships with it, and View copies a diagram as Mermaid or saves it as a picture.

      Press E to edit: the forms, dragging (one shape, or several picked together), connecting,
      recording flows, Undo and Redo of the canvas. Every edit goes through the same checks as the
      browser's and Claude's, and a file changed elsewhere since it was read is never overwritten.
      Opening never creates files in a repo; only an edit does.
  desktop-core:
    type: component
    in: desktop
    name: Core
    tech: C#
    code: [desktop/Flowy.Core/]
    description: |
      A C# port of what `src/core` and the folder loader do, plus what the canvas decides: line
      paths, the camera, layout, the scene, search, the Mermaid text of a view or a flow, which
      folder a pick means, and what a click on a shape's link may open.

      It also edits, on the files' YAML and not on the typed model, so a key it doesn't know is kept.
      A writer produces the `yaml` package's text byte for byte, the edits twin `src/core/ops.ts`,
      and a session applies one, refuses it if it would add a problem, and writes the changed files
      only if they are still as they were read.

      Two readers must give the same answers, so a Node script runs the TypeScript over fixture
      folders and the canvas's own functions, and the C# tests must reproduce every number. That
      includes the beats of a step's animation and the maths that draws them, the navigator's rows, flow groups and keys, and how a
      load-test run reads, rolls up, struggles and is drawn. A root
      test fails if the TypeScript changes without the fixtures being written again.
  desktop-canvas:
    type: component
    in: desktop
    name: Canvas and reader
    tech: Avalonia
    code: [desktop/Flowy.App/Canvas/, desktop/Flowy.App/ReaderView.cs, desktop/Flowy.App/SidePanel.cs, desktop/Flowy.App/Chrome.cs, desktop/Flowy.App/MarkdownView.cs, desktop/Flowy.App/Navigator.cs, desktop/Flowy.App/ExplorerView.cs, desktop/Flowy.App/FlowsView.cs, desktop/Flowy.App/PerfPanel.cs, desktop/Flowy.App/ReaderView.Performance.cs, desktop/Flowy.App/StateMarks.cs]
    description: |
      Shapes are controls on a stage that moves with the camera, with one layer behind them for the
      frame and the lines. The reader holds what you've chosen: the view, the open panel, the flow
      playing.

      A shape is its outline (one of 13, drawn from the same path data as the browser's) with a tint
      of its own colour over it, then its tile, name and how many it holds. A line meets the outline,
      not the rectangle around it.

      The chrome around them is made of a few pieces in the colour of what they are about: a tile
      with the icon of a type on a tint of its colour, chips, section headings with a count, and
      cards. The side panel opens on a header in the shape's own colour, then its description, links,
      code and lines as cards, and the bar's buttons carry icons. All colours come from the stylesheet,
      so light and dark follow the system.

      Opening a shape is a short fly-off and settle-in, one step per screen refresh (the window's own
      animation-frame callback, not a timer, which ticks unevenly), and instant when the system asks
      for less motion.

      An animated flow step plays over the shapes: a pipe along its line, something running through it,
      and the shapes ringing, flashing or squashing. The same frame-driven clock runs it and Autoplay's
      waits, and nothing moves when the system asks for less motion.

      A shape in a state (Starting, Stopped, Degraded and the rest) dims, draws a second outline in the state's dash and carries a
      glyph on a ring. The loops of Starting, Restarting and Degraded run on the same clock, and only while one of them is on screen.

      A rail of icons on the left edge opens the navigator, as on the canvas: the whole documentation
      as a tree drawn a window of rows at a time, shapes that hold others first and then by name, and
      every flow grouped by where it plays. Details opens on the right, from its own rail or by
      picking a shape. Both panels are dragged wider or narrower by their inner edge, and a
      double-click puts the width back. Each project's open tab, open rows and panel widths are
      remembered in the app's state file.

      Where the folder has load-test runs, a Performance button under Details puts a run's panel in
      its place: a slider along the tested loads with Ramp, where things first struggle, and the numbers
      of what is picked. The shapes show their strain and what waits, the lines get thicker, and
      particles run along them on one layer over the shapes, on the window's animation frames and
      none when the system asks for less motion.

      Descriptions are drawn by a small Markdown renderer: raw HTML is dropped, an image shows as
      its description in brackets and is never fetched, and a link opens only if it is http or https.
  desktop-shell:
    type: component
    in: desktop
    name: Windows and shell
    tech: Avalonia
    code: [desktop/Flowy.App/Shell.cs, desktop/Flowy.App/MainWindow.axaml.cs, desktop/Flowy.App/SingleInstance.cs]
    description: |
      One window per model folder, the File, View and Help menus (Open Recent, Reload, Copy as
      Mermaid, Save Picture, the demo), drops, and the saved state (recent folders, the line style,
      the window's size, the app chosen to open linked files). A folder that is deleted while open leaves the last good model with a
      banner, and opening it again carries on. A second launch hands its folder to the one already running through
      a pipe that only this user can open.
  desktop-install:
    type: component
    in: desktop
    name: Installer hooks and updates
    tech: Velopack
    code: [desktop/Flowy.App/Program.cs, desktop/Flowy.App/Updates.cs, desktop/Flowy.App/ExplorerEntries.cs, .github/workflows/desktop.yml]
    description: |
      Velopack builds the installer and runs the app's hooks: after an install or an update the
      "Open with Flowy Docs" entries go into Explorer's folder menu for this user, and uninstalling
      takes them out.

      A few seconds after start-up an installed copy asks GitHub's Releases whether there is a newer
      version, unless Help › Check for updates automatically is off. Nothing about the reader is sent.
  server:
    type: app
    in: flowy
    name: Local server
    tech: Node http
    code: [src/node/server.ts, src/node/files.ts, src/node/git.ts]
    description: |
      Serves the built canvas and the model to 127.0.0.1 only, and watches the folder.

      Two guards keep other pages out: a request whose Host isn't this server's is refused (a site
      can point its own domain at 127.0.0.1), and a write must carry `X-Flowy: 1`, which only a page
      from this origin may send.
  canvas:
    type: app
    in: flowy
    name: Canvas
    tech: React, React Flow
    code: [ui/]
    description: |
      The page: shapes you zoom into, lines that stay quiet until you point at them, flows that play
      step by step, and edit mode behind E.

      A step with an `animation:` plays as a pipe with a blob running through it, and Autoplay
      steps through a flow on its own. A step's `states` dim a shape and draw a second outline and a glyph on it until another step
      changes them. A Performance tab plays a load-test run back over the diagram.

      A rail of icons on the left edge opens a panel with two tabs: the whole documentation as a
      tree, and every flow in it. Details opens on the right, from its own rail or by
      picking a shape, and where the folder has load-test runs the right rail has a Performance
      button that puts its panel in Details' place. Both panels are dragged wider or narrower by
      their inner edge, as in VS Code, and a double-click puts the width back.

      The same bundle is served by the local server, shipped in an export, and shown in the VS Code
      panel; on an exported page the model comes from the HTML and there is nothing to save to.
  mcp:
    type: app
    in: flowy
    name: MCP server
    tech: stdio
    code: [src/node/mcp.ts]
    description: |
      Sixteen tools over stdio: read the model, a view or a Mermaid diagram, and write objects,
      connections, flows and failure analyses.

      Calls arrive in bursts and run one at a time, in order, so each one sees what the one before
      it wrote. A write that loses a race on the file is retried once.

      Its instructions hand Claude the writing rules: survey the repo and check the list first, what
      earns a shape, and how to word a description, a label and a flow step. Before the first flow
      Claude asks how much to animate: None, Key steps or Every step.
  exporter:
    type: app
    in: flowy
    name: Export
    code: [src/node/export.ts]
    description: |
      Writes a read-only copy of the canvas, with the model as JSON inside `index.html`.

      It replaces only what it wrote last time, so a `.git` or a `CNAME` beside it stays, and it
      refuses a folder that holds the model or the canvas it is copying.
  vscode:
    type: app
    in: flowy
    name: VS Code extension
    tech: VS Code webview
    code: [vscode/]
    description: |
      `Flowy: Open Docs` opens the folder in a panel inside VS Code, drawn by the same canvas, which
      reads and edits there as it does in a browser. The page has no server to call, so it asks the
      extension: for the folder's state, and to write a file. The extension answers a write with the same
      code the local server runs, version check and all, and tells the page whenever anything under the
      folder changes, so a save from the editor, the app, the canvas or Claude shows at once.

      It is at home in the editor. A path in a shape's `code` (or a link to a path in the repo) opens in
      the editor beside the panel, and a folder shows in the Explorer. `Show This File in the Docs`, on a
      file's right-click menu, finds the shape whose `code` lists it (the nearest listing, or a pick
      between shapes that list it equally) and shows it. `Open Flow…` and `Go to Shape…` jump to a flow
      or a shape from the palette. The reader's place and settings are kept in the webview's state, so
      a panel VS Code brings back after a restart opens where it was.

      The editor's own theme colours the canvas, and the Mermaid button asks the editor to write to the
      clipboard, because a webview can't count on doing it itself. It needs a trusted, local workspace:
      it runs git in the folder. It keeps no step history, and a file open with unsaved changes in the
      editor is left to VS Code's own conflict prompt.

      `npm run package:vscode` makes a `.vsix` of it: the bundle, the canvas and the notices for what they
      hold, and nothing else. It is built to be published to the Marketplace and Open VSX, and isn't yet.
  core:
    type: app
    in: flowy
    name: Core
    code: [src/core/]
    description: |
      What a model is and what may be done to it, with no Node and no browser in it: the canvas
      bundles the same files the server runs.

      That is why an edit drawn on the canvas and the same edit from Claude are refused for the
      same reasons.
  api:
    type: component
    in: server
    name: HTTP API
    code: [src/node/server.ts, src/node/writes.ts]
    description: |
      `GET /api/state` for everything the canvas shows, `PUT`/`DELETE /api/file/<path>` for one
      file, `GET /api/events` for a line that says "changed" when the folder does.

      The watcher waits 100 ms, so an editor saving three files wakes the page once.
  filestore:
    type: component
    in: server
    name: Folder reader
    code: [src/node/files.ts]
    description: |
      Reads the whole folder into one model and writes one file at a time.

      A write carries the version the caller read (a hash of the file). If the file moved on since,
      the write is dropped with 409 rather than overwriting someone else's change, and nothing is
      written at all while any file in the folder fails to parse.
  gitlink:
    type: component
    in: server
    name: Code links
    code: [src/node/git.ts]
    description: Turns the repo's origin, branch and prefix into the address `code` paths link to. Worked out once per folder, so a branch switch shows after a restart.
  shell:
    type: component
    in: canvas
    name: Canvas page
    code: [ui/src/App.tsx, ui/src/Camera.tsx]
    description: |
      The view you're in, the shape or line you picked, the flow playing, and edit mode. It keeps the
      address in step, so a link opens where it says and Back goes back.

      The camera fits a view when you arrive and pans a shape out from under the side panels, but never
      undoes your own panning.
  graph:
    type: component
    in: canvas
    name: Layout
    code: [ui/src/graph.ts, ui/src/Box.tsx, ui/src/Line.tsx, ui/src/states.tsx]
    description: |
      Turns a view into shapes and lines: dagre places what hasn't been dragged, and the shapes that
      live elsewhere wait around the edges, each on the side that crosses fewest lines.

      A dragged shape keeps its saved place; the rest flow around it.
  motion:
    type: component
    in: canvas
    name: Step motion
    code: [ui/src/StepMotion.tsx, ui/src/motion.ts]
    description: |
      Draws an animated step over the canvas: the line as a pipe, a blob running through it, and rings,
      flashes and squashes on the shapes. It asks core for the beats and knows nothing about kinds.

      Nothing moves when the system asks for less motion; Autoplay then waits a few seconds on each step.
  perf-tab:
    type: component
    in: canvas
    name: Performance tab
    code: [ui/src/Performance.tsx, ui/src/perfview.ts, ui/src/TrafficLayer.tsx, ui/src/traffic.ts, ui/src/pathpoints.ts]
    description: |
      Plays a load-test run back over the canvas: dots run along the lines as often and as slowly as the
      calls were, a shape's outline goes from green to red as it fills up, and the panel reads out the
      load, where things first struggle, and the numbers of what is selected.

      The dots are drawn on one canvas from each line's path, flattened once, and during a ramp the
      screen gets a new position at most every 50 ms. Nothing moves when the system asks for less motion.
  failures-tab:
    type: component
    in: canvas
    name: Failures tab
    code: [ui/src/Failures.tsx, ui/src/FailuresEdit.tsx, ui/src/failuresview.ts]
    description: |
      Lists the rows of an analysis worst first, puts a risk mark on each shape and line, and lights what a picked row hurts. In edit mode it holds the forms that write a row.

      It is browser only for now: the desktop app does not read `failures/` yet.
  navigator:
    type: component
    in: canvas
    name: Navigator
    code: [ui/src/Navigator.tsx, ui/src/navstate.ts, ui/src/navstore.ts, ui/src/window.ts]
    description: |
      The rail of icons on the left edge and the tabs it opens: the whole documentation as a tree
      drawn a window of rows at a time, and every flow, grouped by where it plays. It asks core for the rows,
      which come in VS Code's order: shapes that hold others first, then the rest, each by name.

      The edges of this panel and of the Details panel are sashes you drag to resize them.

      Which tab was open, which shapes were open in the tree and how wide the two panels are are
      remembered for each project, in the browser's storage.
  sync:
    type: component
    in: canvas
    name: Saving
    code: [ui/src/useModel.ts, ui/src/save.ts]
    description: |
      Holds the model the page shows and saves edits one at a time, each one read-apply-check-write
      like the MCP server's.

      It keeps what it can undo for as long as the page is open, and an undo whose file changed
      since is refused rather than forced.
  panel:
    type: component
    in: canvas
    name: Side panel
    code: [ui/src/Panel.tsx, ui/src/Chrome.tsx, ui/src/icons.tsx, ui/src/Search.tsx, ui/src/Code.tsx, ui/src/highlight.ts, ui/src/hljs.ts]
    description: |
      A shape's description, a store's data, its code snippets, links, source files and connections (out and in) while reading; the fields, the flow recorder and Add while editing. Search finds a shape anywhere in the model.

      It looks like the desktop app: a header in the shape's own colour with its tile and chips, then
      section headings and cards, and icons on the bar's buttons.
  model:
    type: component
    in: core
    name: Files
    code: [src/core/model.ts, src/core/state.ts]
    description: |
      Reads and writes the folder's YAML. Parsed with YAML's failsafe schema, so every value stays
      the text that was typed: an id like `007` or a version like `3.10` survives a save.

      A file that can't be trusted (bad syntax, duplicate keys, a merge conflict) is a parse
      error, and nothing is written over it.
  check:
    type: component
    in: core
    name: Checks
    code: [src/core/check.ts]
    description: |
      Every problem in the model, never throwing: a missing name, a shape in a type that can't hold
      it, an unknown shape, colour or icon, a line to nothing, a flow step the view can't show, a
      `code` path that isn't there.

      Problems are shown, not fixed. A file edited by hand keeps its problems until someone deals
      with them.
  animation:
    type: component
    in: core
    name: Animation
    code: [src/core/animation.ts, desktop/Flowy.Core/Animation.cs]
    description: |
      What a flow step's `animation:` may say, and what each kind does, written as a timed list of
      beats: a tube along the line, a blob running through it, a ring or flash or gulp on a shape.

      Nothing here draws. The canvas and the desktop app each draw the beats, so a new kind is a
      recipe here and not new drawing code in both.
  structure:
    type: component
    in: core
    name: Flow structure
    code: [src/core/structure.ts, desktop/Flowy.Core/Structure.cs]
    description: |
      How the steps of a flow relate. A stretch of neighbouring steps can repeat, be one of several
      lanes, or run in parallel, and a step can say that another flow tells the rest. Written as runs
      and stops, the steps a reader sees at once.

      Nothing here draws. The checker reports a wrong group, and Mermaid turns a good one into a
      loop, alt or par block, so the rules live here once for the browser and the desktop app.
  states:
    type: component
    in: core
    name: Shape states
    code: [src/core/states.ts, desktop/Flowy.Core/States.cs]
    description: |
      Where a shape stands: Running, Starting, Stopping, Stopped, Restarting or Degraded. A flow says where shapes stand before step 1 and a step changes some of them. This works out the state at any stop by following the stops in order, so stepping back needs no undo, and rolls a container's state up from what it holds.

      Nothing here draws. The canvas and the desktop app each draw the result (a second outline, a glyph, a dimmed shape), and the desktop app's port (`States.cs`) is kept equal by fixtures.
  store-data:
    type: component
    in: core
    name: Store data
    code: [src/core/data.ts, desktop/Flowy.Core/StoreData.cs]
    description: |
      What a store holds: tables as columns and sample rows, key sets, topics and sample documents, each with a limits line and short notes. It works out what the Data section shows and what is wrong with the data: a row of the wrong width, a sample nested too deep, a note on a field that is not there.

      The author types it, or Claude writes it from the code. Flowy never connects to a database. Nothing here draws: the canvas and the desktop app each draw the entries, and the desktop app's port (`StoreData.cs`) is kept equal by fixtures.
  snippets:
    type: component
    in: core
    name: Code snippets
    tech: TypeScript
    code: [src/core/snippets.ts, src/core/detect.ts, desktop/Flowy.Core/Snippets.cs, desktop/Flowy.Core/Detect.cs]
    description: |
      A few lines of code on a shape, each with a title and a language: what is allowed (at most six snippets of 40 lines), what is
      wrong with a snippet, and the order its keys are written in. When a snippet names no language, a table of cues works it out from
      the code, and leaves a word, a log line or prose plain.

      Nothing here draws. The canvas colours code with highlight.js, and the desktop app runs the same highlight.js in-process, so the
      two show the same colours. The desktop app's ports (`Snippets.cs`, `Detect.cs`) are kept equal by fixtures.
  perf:
    type: component
    in: core
    name: Performance runs
    code: [src/core/perf.ts, desktop/Flowy.Core/Perf.cs]
    description: |
      A load test as numbers: for each load level that was tested, what each shape and each
      connection measured. It reads a run file, checks it against the model, and works out what the
      Performance tab will show at a load: the numbers between two tested levels, the worst of what
      a shape holds, where things first struggle, and how busy each line is.

      A run can also set a source: the colour of its dots, and formulas for how many dots a line shows
      and how big each is. A line past the screen's limit is scaled down and says so.
  formula:
    type: component
    in: core
    name: Traffic formula
    code: [src/core/formula.ts, desktop/Flowy.Core/Formula.cs]
    description: |
      The small arithmetic a run's source uses: numbers, `rate`, `bytes` and `p50`, and `+ - * /`. A
      hand-written reader and evaluator, with no functions and no `eval`, so a formula that can't be read is
      a problem with a place in it and never a crash. The desktop app's port (`Formula.cs`) is kept equal by fixtures.

      It replays what was measured and never predicts: above the highest tested load there is
      nothing to show. Nothing here draws: the canvas and the desktop app each show it, and the desktop
      app's port (`Perf.cs`) is kept equal by fixtures.
  failures:
    type: component
    in: core
    name: Failure analyses
    code: [src/core/failures.ts]
    description: |
      A failure analysis as data: one row for each way a part fails, with how bad, how likely and how hard to spot it, and what to do next. It ranks the rows by risk, checks them against the model, and works out where a row's mark goes at each zoom level.

      Nothing here draws or reads a file. The canvas shows it, and the checker refuses an analysis that names a shape, a line, a flow or a step that isn't there.
  views:
    type: component
    in: core
    name: Views
    code: [src/core/views.ts]
    description: |
      What one level shows: the shapes inside it, the shapes elsewhere that lines reach, and where a
      line between two of them lands.

      A line between shapes deeper down is drawn between the shapes that stand for them here, and
      several such lines merge into one, labelled "N connections".
  outline:
    type: component
    in: core
    name: Outline
    code: [src/core/outline.ts, desktop/Flowy.Core/Outline.cs]
    description: |
      What the navigator shows: the shapes as a tree with the flows under the systems they play in,
      the flows grouped by where they play, and what each key does in the tree.

      It draws nothing. The canvas and the desktop app each draw these rows, so they agree on what is
      on every line: its counts, its problem mark and which rows a filter keeps.
  ops:
    type: component
    in: core
    name: Edits
    code: [src/core/ops.ts]
    description: |
      Every change anything may make: add or change a shape (its type, shape, colour, opacity and icon
      too), connect, disconnect, put or delete a flow or a custom icon, place shapes, pick a line style.

      Each one returns a new model, and a change that would add a problem is refused before
      anything is written.
  look:
    type: component
    in: core
    name: Look
    tech: TypeScript
    code: [src/core/look.ts, src/core/icons.ts]
    description: |
      How a shape is drawn: 13 outlines (each with the room its text has and the polygon a line
      meets), named colours with a light and a dark form, how strong a fill is, and about 150
      built-in icons plus the ones a model defines under `icons:`.

      The type picks a default for each (an actor is a pill, a store a cylinder). The desktop app
      writes its own copy of these tables from these two files, and a fixture checks the copy.
  mermaid:
    type: component
    in: core
    name: Mermaid
    code: [src/core/mermaid.ts]
    description: A view as a flowchart, a flow as a sequence diagram (a group of steps becomes a loop, alt or par block), fenced and ready to paste where GitHub or GitLab draws it. A shape becomes the closest Mermaid node, and a colour a style line.
