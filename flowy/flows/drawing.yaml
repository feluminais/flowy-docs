name: Dragging a shape
view: flowy
steps:
  - { from: reader, to: canvas, text: Drags a shape in edit mode }
  - from: canvas
    to: server
    text: PUT /api/file/layout.yaml, with the version it read
    description: |
      The whole view's positions go in one write. The version is a hash of the file as the page last
      saw it, and the write carries `X-Flowy: 1`, which only a page from this origin may send.
  - from: server
    text: Refuses the write if the file moved on
    description: |
      409, and nothing is written, when the hash doesn't match: your editor, an AI or another tab
      got there first. The page drops the edit and reloads rather than overwriting it.
  - { from: server, to: repo, text: Writes the file }
  - { from: server, to: canvas, text: The watcher says "changed"; the page loads the model again }
