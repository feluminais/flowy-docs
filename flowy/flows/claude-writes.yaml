name: Claude maps the repo
view: flowy
steps:
  - { from: claude, to: mcp, text: "put_object, connect, put_flow" }
  - { from: mcp, to: core, text: Applies the change to a fresh read of the model }
  - from: core
    text: Refuses anything that would add a problem
    description: |
      Problems already in the files are left alone. The point is that a write may not add one. A
      `code` path that doesn't exist counts, which the canvas can't see and Node can, so Claude
      can't point a shape at code that's gone.
  - { from: mcp, to: repo, text: Writes only the files that changed }
  - { from: canvas, text: Picks the change up without a reload }
