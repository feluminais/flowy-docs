name: An AI maps the repo
view: flowy
steps:
  - { from: ai, to: mcp, text: "put_object, connect, put_flow", animation: call }
  - { from: mcp, to: core, text: Applies the change to a fresh read of the model, animation: call }
  - from: core
    text: Refuses anything that would add a problem
    description: |
      Problems already in the files are left alone; a write may not add one. A `code` path that
      doesn't exist counts (the canvas can't check it, Node can), so the AI can't point a shape at
      code that's gone.
  - { from: mcp, to: repo, text: Writes only the files that changed, animation: send }
  - { from: canvas, text: Picks the change up without a reload }
