name: Editing a shape in the app
view: desktop
steps:
  - { from: reader, to: desktop-canvas, text: "Presses E, opens a shape and changes its name" }
  - { from: desktop-canvas, to: desktop-core, text: "Asks for the edit when the field is left" }
  - from: desktop-core
    text: Applies it to the files' YAML and refuses it if it would add a problem
    description: |
      The files are read fresh first, so the edit starts from disk, not from what the window last drew. A file that can't be read blocks editing, and nothing is written.
  - from: desktop-core
    to: folder
    text: Writes only the files that changed
    description: |
      Each goes to a temporary file that is moved over the real one, only if the file still has the
      version that was read. If another program changed it meanwhile, the edit is dropped and
      the window says so.
  - { from: desktop-core, to: desktop-canvas, text: "The folder is read again, and the view redraws with the panel as it was" }
